<h1>Reset Your Password</h1>

<p class="subtitle">
Enter the email address associated with your account.
If an account exists, we'll help you reset your password.
</p>

<input
type="email"
id="email"
placeholder="Enter your email address"
autocomplete="email">

<br><br>

<button
id="recoverBtn"
onclick="recoverPassword()">

Continue

</button>

<br><br>

<div id="result"></div>

<script type="module">


window.recoverPassword = async function () {

    const btn = document.getElementById("recoverBtn");

    const result = document.getElementById("result");

    btn.disabled = true;
    btn.innerHTML = "Sending...";

    showLoading(
"Sending Reset Email...",
"Please wait while we send your password reset email."
);

    result.innerHTML = "";
    result.className = "";

    const email = document
        .getElementById("email")
        .value
        .trim()
        .toLowerCase();

    const emailPattern = /^[^\s@]+@[^\s@]+\.[^\s@]+$/;

if (!emailPattern.test(email)) {

    result.classList.add("error");

    result.innerHTML =
    "📧 Please enter a valid email address. Example: name@gmail.com";

    btn.disabled = false;
    btn.innerHTML = "Continue";

    hideLoading();

    return;
}
   // Check password reset limit

const resetData =
JSON.parse(localStorage.getItem("passwordResetAttempts")) || {
    count:0,
    time:null
};


const now = Date.now();


// Reset after 24 hours

if(
resetData.time &&
now - resetData.time > 24*60*60*1000
){

resetData.count = 0;
resetData.time = null;

localStorage.setItem(
"passwordResetAttempts",
JSON.stringify(resetData)
);

}



if(resetData.count >= 2){

result.classList.add("error");

result.innerHTML =
"⏳ You have reached today's password reset limit.<br><br>Please try again in 24 hours.";

btn.disabled = true;

btn.innerHTML =
"Try Again Later";

return;

}

   try {

    const response = await fetch(
  "https://us-central1-gedarak-26ca6.cloudfunctions.net/sendPasswordResetEmail",
        {
            method: "POST",
            headers: {
                "Content-Type": "application/json"
            },
            body: JSON.stringify({
                email: email
            })
        }
    );

    const data = await response.json();

    if (response.ok && data.success) {

        result.classList.add("success");

        result.innerHTML =
        "✅ Password reset email has been sent.<br><br>Please check your inbox and spam folder.";

        const resetData =
JSON.parse(localStorage.getItem("passwordResetAttempts")) || {
count:0,
time:null
};


resetData.count++;


if(!resetData.time){

resetData.time = Date.now();

}


localStorage.setItem(
"passwordResetAttempts",
JSON.stringify(resetData)
);

        hideLoading();

/* Keep button disabled */
btn.innerHTML = "Email Sent ✓";

return;

    } else {

        throw new Error(data.message || "Unable to send reset email.");

    }

}

catch (error) {

    console.error(error);

    result.classList.add("error");

    result.innerHTML =
    "📧 If an account exists with this email, you will receive a password reset link. Please check your inbox and spam folder.";

    hideLoading();

}

    btn.disabled = false;
    btn.innerHTML = "Continue";

};

document.addEventListener("keydown", function(e){

    if(e.key==="Enter"){

        recoverPassword();

    }

});

document.getElementById("email").focus();

const savedAttempts =
JSON.parse(localStorage.getItem("passwordResetAttempts"));

if(
savedAttempts &&
savedAttempts.count >= 2 &&
Date.now()-savedAttempts.time < 24*60*60*1000
){

const btn =
document.getElementById("recoverBtn");


btn.disabled = true;

btn.innerHTML =
"Try Again Later";


document.getElementById("result").classList.add("error");

document.getElementById("result").innerHTML =
"⏳ You have reached today's password reset limit.<br><br>Please try again in 24 hours.";

}

function showLoading(
title="Sending Email...",
text="Please wait while we send your password reset email."
){

document.getElementById("loadingTitle").textContent=title;

document.getElementById("loadingText").textContent=text;

document.getElementById("loadingAlert").style.display="flex";

}

function hideLoading(){

document.getElementById("loadingAlert").style.display="none";

}

</script>

</div>

</h2>

</p>

</div>

</div>
