<!DOCTYPE html>
<html>

<head>
<meta charset="UTF-8">

<meta name="viewport" content="width=device-width, initial-scale=1.0">
   <meta name="robots" content="noindex, nofollow">
<title>

Manage Properties

</title>

<link rel="stylesheet" href="style.css">

<style>

body{

font-family:Arial;

padding:30px;

max-width:1400px;

margin:auto;

}

table{

width:100%;

border-collapse:collapse;

margin-top:20px;

}

th{

background:#009688;

color:white;

padding:12px;

}

td{

padding:12px;

border-bottom:1px solid #ddd;

text-align:center;

}

img{

width:120px;

height:80px;

object-fit:cover;

border-radius:8px;

}

button{

padding:8px 14px;

cursor:pointer;

border:none;

border-radius:8px;

margin:3px;

}

input{

padding:10px;

width:350px;

font-size:16px;

}

#gedarakModal{

position:fixed;

top:0;
left:0;

width:100%;
height:100%;

background:rgba(0,0,0,.45);

display:none;

align-items:center;
justify-content:center;

z-index:999999;

}


.modal-box{

background:white;

width:90%;
max-width:420px;

padding:35px;

border-radius:20px;

text-align:center;

box-shadow:0 15px 40px rgba(0,0,0,.3);

animation:popup .25s ease;

}


.modal-box h2{

margin:0 0 15px;

font-size:26px;

}


.modal-box p{

font-size:22px;

font-weight:600;

color:#333;

line-height:1.5;

}


.modal-buttons{

display:flex;

gap:12px;

justify-content:center;

margin-top:25px;

}


.modal-buttons button{

padding:12px 25px;

border:none;

border-radius:12px;

font-size:16px;

font-weight:bold;

cursor:pointer;

}


.modal-ok{

background:#16a34a;

color:white;

}


.modal-later{

background:#e5e7eb;

color:#333;

}


@keyframes popup{

from{

transform:scale(.8);

opacity:0;

}

to{

transform:scale(1);

opacity:1;

}

}

@keyframes spin{

    from{
        transform:rotate(0deg);
    }

    to{
        transform:rotate(360deg);
    }

}

</style>

</head>

<body>

<a href="admin.html">

<button>

⬅ Dashboard

</button>

</a>

<h1>

Property Management

</h1>

<input

id="search"

placeholder="Search property..."

onkeyup="loadProperties()">

<table>

<thead>

<tr>

<th>

Image

</th>

<th>

Name

</th>

<th>

District

</th>

<th>

City

</th>

<th>

Type

</th>

<th>

Price

</th>

<th>

Status

</th>

<th>

Views

</th>

<th>

Posted

</th>

<th>

Actions

</th>

</tr>

</thead>

<tbody id="propertyTable">

</tbody>

</table>

   <div id="gedarakModal">

    <div class="modal-box">

        <div
            id="modalSpinner"
            style="
                display:none;
                font-size:50px;
                margin-bottom:15px;
                animation:spin 1s linear infinite;
            "
        >
            ⏳
        </div>

        <h2 id="modalTitle">
            Gedarak.lk
        </h2>

        <p id="modalMessage"></p>

        <div class="modal-buttons">

            <button
                id="modalOk"
                class="modal-ok">
                OK
            </button>

            <button
                id="modalLater"
                class="modal-later">
                Cancel
            </button>

        </div>

    </div>

</div>

<script type="module">

    import { auth, db } from "./firebase-config.js";

import {
collection,
getDocs,
deleteDoc,
doc,
getDoc
}
from "https://www.gstatic.com/firebasejs/12.16.0/firebase-firestore.js";

import {
onAuthStateChanged
}
from "https://www.gstatic.com/firebasejs/12.16.0/firebase-auth.js";

import { deletePropertyCompletely } from "./delete-property.js";

onAuthStateChanged(auth, async(user)=>{

if(!user){

window.location.href="login.html";
return;

}

const userSnap =
await getDoc(doc(db,"users",user.uid));

if(!userSnap.exists() ||
userSnap.data().role !== "Admin"){

showAlert(

"⛔ Access Denied.\n\nOnly administrators can access this page.",

function(){

window.location.href="index.html";

},

true

);

return;

}

loadProperties();

});

async function loadProperties(){

    const table =
        document.getElementById("propertyTable");


    /* =====================================================
       SHOW LOADING
       ===================================================== */

    table.innerHTML = `

        <tr>

            <td
                colspan="10"
                style="
                    text-align:center;
                    padding:45px;
                    font-size:18px;
                    color:#666;
                "
            >

                <div
                    style="
                        font-size:38px;
                        margin-bottom:12px;
                        animation:spin 1s linear infinite;
                    "
                >
                    ⏳
                </div>

                <strong>
                    Loading properties...
                </strong>

                <div
                    style="
                        margin-top:8px;
                        font-size:14px;
                        color:#999;
                    "
                >
                    Please wait while we retrieve the properties.
                </div>

            </td>

        </tr>

    `;


    try{

        /* =================================================
           GET PROPERTIES
           ================================================= */

        const snapshot =
            await getDocs(
                collection(db,"properties")
            );


        table.innerHTML = "";


        const search =
            document
                .getElementById("search")
                .value
                .trim()
                .toLowerCase();


        let visibleProperties = 0;


        /* =================================================
           DISPLAY PROPERTIES
           ================================================= */

        snapshot.forEach((document)=>{

            const p = {

                id:document.id,

                ...document.data()

            };


            const searchable = (

                (p.name || "") + " " +

                (p.city || "") + " " +

                (p.district || "") + " " +

                (p.propertyType || "") + " " +

                (p.status || "")

            ).toLowerCase();


            /* SEARCH */

            if(
                search &&
                !searchable.includes(search)
            ){

                return;

            }


            visibleProperties++;


            /* =================================================
               DATE
               ================================================= */

            let postedDate = "-";


            if(p.createdAt){

                try{

                    if(
                        typeof p.createdAt.toDate ===
                        "function"
                    ){

                        postedDate =
                            p.createdAt
                            .toDate()
                            .toLocaleDateString(
                                "en-LK"
                            );

                    }

                    else if(
                        typeof p.createdAt.toMillis ===
                        "function"
                    ){

                        postedDate =
                            new Date(
                                p.createdAt.toMillis()
                            )
                            .toLocaleDateString(
                                "en-LK"
                            );

                    }

                }
                catch(error){

                    console.error(
                        "Date formatting error:",
                        error
                    );

                }

            }


            /* =================================================
               STATUS COLOR
               ================================================= */

            let statusColor = "orange";


            if(p.status === "For Sale"){

                statusColor = "green";

            }

            else if(p.status === "For Rent"){

                statusColor = "blue";

            }


            /* =================================================
               FIRST IMAGE
               ================================================= */

            const firstImage =
                p.images?.[0] || "";


            /* =================================================
               ADD ROW
               ================================================= */

            table.innerHTML += `

                <tr>


                    <!-- IMAGE -->

                    <td>

                        ${
                            firstImage
                            ?

                            `
                            <img
                                src="${firstImage}"
                                alt="Property"
                            >
                            `

                            :

                            `
                            <div
                                style="
                                    width:120px;
                                    height:80px;
                                    display:flex;
                                    align-items:center;
                                    justify-content:center;
                                    background:#f1f1f1;
                                    border-radius:8px;
                                    color:#999;
                                "
                            >
                                No Image
                            </div>
                            `
                        }

                    </td>


                    <!-- NAME -->

                    <td>

                        ${p.name || "-"}

                    </td>


                    <!-- DISTRICT -->

                    <td>

                        ${p.district || "-"}

                    </td>


                    <!-- CITY -->

                    <td>

                        ${p.city || "-"}

                    </td>


                    <!-- TYPE -->

                    <td>

                        ${p.propertyType || "-"}

                    </td>


                    <!-- PRICE -->

                    <td>

                        ${
                            p.negotiable

                            ?

                            "💬 Negotiable"

                            :

                            "💸 Rs. " +
                            Number(
                                p.price || 0
                            ).toLocaleString()

                        }

                    </td>


                    <!-- STATUS -->

                    <td>

                        <span
                            style="
                                font-weight:bold;
                                color:${statusColor};
                            "
                        >

                            ${p.status || "-"}

                        </span>

                    </td>


                    <!-- VIEWS -->

                    <td>

                        ${p.views || 0}

                    </td>


                    <!-- POSTED -->

                    <td>

                        ${postedDate}

                    </td>


                    <!-- ACTIONS -->

                    <td>

                        <button
                            style="
                                background:#1976d2;
                                color:white;
                            "
                            onclick="
                                viewProperty('${p.id}')
                            "
                        >

                            👁 View

                        </button>


                        <button
                            style="
                                background:#2e7d32;
                                color:white;
                            "
                            onclick="
                                editProperty('${p.id}')
                            "
                        >

                            ✏ Edit

                        </button>


                        <button
                            style="
                                background:#d32f2f;
                                color:white;
                            "
                            onclick="
                                deleteProperty('${p.id}')
                            "
                        >

                            🗑 Delete

                        </button>

                    </td>


                </tr>

            `;

        });


        /* =================================================
           NO RESULTS
           ================================================= */

        if(visibleProperties === 0){

            table.innerHTML = `

                <tr>

                    <td
                        colspan="10"
                        style="
                            text-align:center;
                            padding:40px;
                            color:#777;
                            font-size:17px;
                        "
                    >

                        ${
                            search

                            ?

                            "🔎 No properties match your search."

                            :

                            "🏠 No properties have been posted yet."

                        }

                    </td>

                </tr>

            `;

        }

    }

    catch(error){

        console.error(
            "Error loading properties:",
            error
        );


        table.innerHTML = `

            <tr>

                <td
                    colspan="10"
                    style="
                        text-align:center;
                        padding:40px;
                        color:#b00020;
                        font-size:17px;
                    "
                >

                    ❌ Unable to load properties.

                    <br><br>

                    <span
                        style="
                            font-size:14px;
                            color:#777;
                        "
                    >

                        Please check your internet connection
                        and try again.

                    </span>

                </td>

            </tr>

        `;

    }

}

async function deleteProperty(id){

    showAlert(

        "🗑 Delete this property permanently?",

        async function(){

            /* =================================================
               SHOW DELETING LOADING POPUP
               ================================================= */

            showAlert(

                "The property and its images are being permanently deleted.\n\nPlease wait...",

                null,

                true,

                "🗑 Deleting Property...",

                true

            );


            try{

                /* =================================================
                   DELETE PROPERTY + ALL IMAGES
                   ================================================= */

                await deletePropertyCompletely(id);


                /* =================================================
                   REFRESH PROPERTY LIST
                   ================================================= */

                await loadProperties();


                /* =================================================
                   SUCCESS MESSAGE
                   ================================================= */

                showAlert(

                    "The property and its associated images have been permanently deleted.",

                    null,

                    true,

                    "✅ Property Deleted"

                );

            }

            catch(error){

                console.error(
                    "Property deletion error:",
                    error
                );


                /* =================================================
                   ERROR MESSAGE
                   ================================================= */

                showAlert(

                    "The property could not be deleted.\n\nPlease check your internet connection and try again.",

                    null,

                    true,

                    "❌ Deletion Failed"

                );

            }

        },

        false,

        "Delete Property"

    );

}


window.editProperty = function(id){

sessionStorage.setItem(
"editPropertyId",
id
);

showAlert(

"✏ Opening the property editor...",

function(){

window.location.href =
"editproperty.html";

},

true,

"Edit Property"

);

}
function viewProperty(id){

showAlert(

"🏠 Opening property...",

function(){

window.location.href =
"property.html?id=" + id;

},

true,

"View Property"

);
}

 window.showAlert = function(
    message,
    okAction,
    hideLater = false,
    title = "Gedarak.lk",
    hideButtons = false
){

    const modal =
        document.getElementById("gedarakModal");


    const buttons =
        document.querySelector(".modal-buttons");


    const spinner =
        document.getElementById("modalSpinner");


    /* =====================================================
       BUTTONS
       ===================================================== */

    buttons.style.display =
        hideButtons
        ? "none"
        : "flex";


    /* =====================================================
       SPINNER
       ===================================================== */

    spinner.style.display =
        hideButtons
        ? "block"
        : "none";


    /* =====================================================
       TITLE
       ===================================================== */

    document.getElementById(
        "modalTitle"
    ).textContent =
        title;


    /* =====================================================
       MESSAGE
       ===================================================== */

    document.getElementById(
        "modalMessage"
    ).textContent =
        message;


    /* =====================================================
       CANCEL / LATER BUTTON
       ===================================================== */

    const laterBtn =
        document.getElementById("modalLater");


    laterBtn.style.display =
        hideLater
        ? "none"
        : "inline-block";


    /* =====================================================
       SHOW MODAL
       ===================================================== */

    modal.style.display =
        "flex";


    /* =====================================================
       OK BUTTON
       ===================================================== */

    document.getElementById(
        "modalOk"
    ).onclick = function(){

        modal.style.display =
            "none";


        if(okAction){

            okAction();

        }

    };


    /* =====================================================
       LATER / CANCEL BUTTON
       ===================================================== */

    laterBtn.onclick = function(){

        modal.style.display =
            "none";

    };

};


window.deleteProperty = deleteProperty;
window.viewProperty = viewProperty;
window.loadProperties = loadProperties;

</script>

</body>

</html>
