<!DOCTYPE html>
<html>

<head>
<meta charset="UTF-8">

<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>

Manage Properties

</title>

<link rel="stylesheet" href="style.css">

<style>

body{

font-family:Arial;

padding:30px;

max-width:1400px;

margin:auto;

}

table{

width:100%;

border-collapse:collapse;

margin-top:20px;

}

th{

background:#009688;

color:white;

padding:12px;

}

td{

padding:12px;

border-bottom:1px solid #ddd;

text-align:center;

}

img{

width:120px;

height:80px;

object-fit:cover;

border-radius:8px;

}

button{

padding:8px 14px;

cursor:pointer;

border:none;

border-radius:8px;

margin:3px;

}

input{

padding:10px;

width:350px;

font-size:16px;

}

#gedarakModal{

position:fixed;

top:0;
left:0;

width:100%;
height:100%;

background:rgba(0,0,0,.45);

display:none;

align-items:center;
justify-content:center;

z-index:999999;

}


.modal-box{

background:white;

width:90%;
max-width:420px;

padding:35px;

border-radius:20px;

text-align:center;

box-shadow:0 15px 40px rgba(0,0,0,.3);

animation:popup .25s ease;

}


.modal-box h2{

margin:0 0 15px;

font-size:26px;

}


.modal-box p{

font-size:22px;

font-weight:600;

color:#333;

line-height:1.5;

}


.modal-buttons{

display:flex;

gap:12px;

justify-content:center;

margin-top:25px;

}


.modal-buttons button{

padding:12px 25px;

border:none;

border-radius:12px;

font-size:16px;

font-weight:bold;

cursor:pointer;

}


.modal-ok{

background:#16a34a;

color:white;

}


.modal-later{

background:#e5e7eb;

color:#333;

}


@keyframes popup{

from{

transform:scale(.8);

opacity:0;

}

to{

transform:scale(1);

opacity:1;

}

}

</style>

</head>

<body>

<a href="admin.html">

<button>

⬅ Dashboard

</button>

</a>

<h1>

Property Management

</h1>

<input

id="search"

placeholder="Search property..."

onkeyup="loadProperties()">

<table>

<thead>

<tr>

<th>

Image

</th>

<th>

Name

</th>

<th>

District

</th>

<th>

City

</th>

<th>

Type

</th>

<th>

Price

</th>

<th>

Status

</th>

<th>

Views

</th>

<th>

Posted

</th>

<th>

Actions

</th>

</tr>

</thead>

<tbody id="propertyTable">

</tbody>

</table>

   <div id="gedarakModal">

<div class="modal-box">

<h2 id="modalTitle">
Gedarak.lk
</h2>

<p id="modalMessage"></p>

<div class="modal-buttons">

<button
id="modalOk"
class="modal-ok">
OK
</button>

<button
id="modalLater"
class="modal-later">
Cancel
</button>

</div>

</div>

</div>

<script type="module">

    import { auth, db } from "./firebase-config.js";

import {
collection,
getDocs,
deleteDoc,
doc,
getDoc
}
from "https://www.gstatic.com/firebasejs/12.16.0/firebase-firestore.js";

import {
onAuthStateChanged
}
from "https://www.gstatic.com/firebasejs/12.16.0/firebase-auth.js";

onAuthStateChanged(auth, async(user)=>{

if(!user){

window.location.href="login.html";
return;

}

const userSnap =
await getDoc(doc(db,"users",user.uid));

if(!userSnap.exists() ||
userSnap.data().role !== "Admin"){

showAlert(

"⛔ Access Denied.\n\nOnly administrators can access this page.",

function(){

window.location.href="index.html";

},

true

);

return;

}

loadProperties();

});

async function loadProperties(){

const snapshot = await getDocs(collection(db,"properties"));

let table = document.getElementById("propertyTable");

table.innerHTML = "";

let search =
document.getElementById("search").value.toLowerCase();

snapshot.forEach((document)=>{

const p = {
id: document.id,
...document.data()
};

let searchable = (
(p.name || "") + " " +
(p.city || "") + " " +
(p.district || "") + " " +
(p.propertyType || "") + " " +
(p.status || "")
).toLowerCase();

if(!searchable.includes(search)){
return;
}

table.innerHTML += `

<tr>

<td>
<img src="${p.images?.[0] || ''}">
</td>

<td>${p.name}</td>

<td>${p.district}</td>

<td>${p.city}</td>

<td>${p.propertyType}</td>

<td>

${
p.negotiable
?
"💬 Negotiable"
:
"💸 Rs. " + Number(p.price).toLocaleString()
}

</td>

<td>

<span style="
font-weight:bold;
color:
${p.status=="For Sale"?"green":
p.status=="For Rent"?"blue":
"orange"};
">

${p.status}

</span>

</td>

<td>

${p.views || 0}

</td>

<td>

${
p.createdAt
?
new Date(
p.createdAt.toMillis()
).toLocaleDateString()
:
"-"
}

</td>

<td>

<button
style="background:#1976d2;color:white;"
onclick="viewProperty('${p.id}')">
👁 View
</button>

<button
style="background:#2e7d32;color:white;"
onclick="editProperty('${p.id}')">
✏ Edit
</button>

<button
style="background:#d32f2f;color:white;"
onclick="deleteProperty('${p.id}')">
🗑 Delete
</button>

</td>

</tr>

`;

});

}

async function deleteProperty(id){

showAlert(

"🗑 Delete this property permanently?",

async function(){

await deleteDoc(
doc(db,"properties",id)
);

loadProperties();

showAlert(

"✅ Property deleted successfully.",

null,

true,

"Deleted"

);

},

false,

"Delete Property"

);

}


window.editProperty = function(id){

sessionStorage.setItem(
"editPropertyId",
id
);

showAlert(

"✏ Opening the property editor...",

function(){

window.location.href =
"editproperty.html";

},

true,

"Edit Property"

);

}
function viewProperty(id){

showAlert(

"🏠 Opening property...",

function(){

window.location.href =
"property.html?id=" + id;

},

true,

"View Property"

);
}

 window.showAlert = function(
    message,
    okAction,
    hideLater = false,
    title = "Gedarak.lk"
){

    const modal =
    document.getElementById("gedarakModal");

    document.getElementById("modalTitle").textContent =
    title;

    document.getElementById("modalMessage").textContent =
    message;

    const laterBtn =
    document.getElementById("modalLater");

    laterBtn.style.display =
    hideLater ? "none" : "inline-block";

    modal.style.display = "flex";

    document.getElementById("modalOk").onclick = function(){

        modal.style.display = "none";

        if(okAction){

            okAction();

        }

    };

    laterBtn.onclick = function(){

        modal.style.display = "none";

    };

}


window.deleteProperty = deleteProperty;
window.editProperty = editProperty;
window.viewProperty = viewProperty;
window.loadProperties = loadProperties;

</script>

</body>

</html>
