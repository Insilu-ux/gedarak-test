<!DOCTYPE html>
<html>
<head>

</head>
<body>
    <a href="index.html">
            <button class="home-btn">
                💒 Home
            </button>
        </a>
<h1 style="text-align:center;">
📧 Email Verification
</h1>

<p style="
text-align:center;
font-size:18px;
color:#666;
">
Verify your email to increase buyer trust.
</p>

<div style="
max-width:600px;
margin:35px auto;
background:white;
padding:30px;
border-radius:18px;
box-shadow:0 4px 15px rgba(0,0,0,.08);
">

<h3>Email Address</h3>

<p
id="emailAddress"
style="
font-size:18px;
font-weight:bold;
margin-bottom:20px;
">
</p>

<p
id="status"
style="
font-size:18px;
margin-bottom:25px;
">
Not Verified
</p>

<button
id="sendButton"
style="
width:100%;
padding:15px;
background:#0d6efd;
color:white;
border:none;
border-radius:12px;
font-size:18px;
font-weight:bold;
cursor:pointer;
margin-bottom:15px;
">
Send Verification Email
</button>



</div>
<script type="module">

import { auth } from "./firebase-config.js";

import {
onAuthStateChanged
}
from "https://www.gstatic.com/firebasejs/12.16.0/firebase-auth.js";


let currentUser = null;


onAuthStateChanged(auth,(user)=>{

if(!user){

window.location.href="login.html";

return;

}

currentUser=user;


document.getElementById("emailAddress").innerHTML =
user.email;


});


document.getElementById("sendButton").onclick =
async function(){

if(!currentUser){

return;

}


try{


const response = await fetch(
"https://us-central1-gedarak-26ca6.cloudfunctions.net/sendVerificationEmail",
{

method:"POST",

headers:{

"Content-Type":"application/json"

},

body:JSON.stringify({

email:currentUser.email,
uid:currentUser.uid

})

});


const result = await response.json();


if(result.success){


document.getElementById("status").innerHTML =
"📧 Verification email sent successfully.<br><br>Please check your inbox and spam folder.";

document.getElementById("status").style.color =
"#0d6efd";


}
else{


throw new Error(result.message);


}


}

catch(error){

console.log(error);


document.getElementById("status").innerHTML =
"❌ Failed to send verification email.";

document.getElementById("status").style.color =
"red";


}


};


</script>
</body>
</html>
