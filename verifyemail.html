<!DOCTYPE html>
<html>
<head>
<style>
    @keyframes spin{

0%{
transform:rotate(0deg);
}

100%{
transform:rotate(360deg);
}

}
</style>
</head>
<body>
    <a href="index.html">
            <button class="home-btn">
                💒 Home
            </button>
        </a>
<h1 style="text-align:center;">
📧 Email Verification
</h1>

<p style="
text-align:center;
font-size:18px;
color:#666;
">
Verify your email to increase buyer trust.
</p>

<div style="
max-width:600px;
margin:35px auto;
background:white;
padding:30px;
border-radius:18px;
box-shadow:0 4px 15px rgba(0,0,0,.08);
">

<h3>Email Address</h3>

<p
id="emailAddress"
style="
font-size:18px;
font-weight:bold;
margin-bottom:20px;
">
</p>

<p
id="status"
style="
font-size:18px;
margin-bottom:25px;
">
Not Verified
</p>

<button
id="sendButton"
style="
width:100%;
padding:15px;
background:#0d6efd;
color:white;
border:none;
border-radius:12px;
font-size:18px;
font-weight:bold;
cursor:pointer;
margin-bottom:15px;
">
Send Verification Email
</button>



</div>
<script type="module">

import { auth, db } from "./firebase-config.js";

import {
onAuthStateChanged
}
from "https://www.gstatic.com/firebasejs/12.16.0/firebase-auth.js";

import {
doc,
getDoc
}
from "https://www.gstatic.com/firebasejs/12.16.0/firebase-firestore.js";

let currentUser = null;


onAuthStateChanged(auth, async(user)=>{

if(!user){

window.location.href="login.html";

return;

}

currentUser=user;


document.getElementById("emailAddress").innerHTML =
user.email;


// CHECK FIRESTORE VERIFICATION STATUS

const userSnap =
await getDoc(
doc(db,"users",user.uid)
);


if(userSnap.exists()){

const userData = userSnap.data();


if(userData.emailVerified){

document.getElementById("status").innerHTML =
"✔ Your email has been verified successfully.";

document.getElementById("status").style.color =
"#16a34a";


document.getElementById("sendButton").innerHTML =
"Email Verified";


document.getElementById("sendButton").disabled = true;


document.getElementById("sendButton").style.opacity =
"0.6";


}

}

});


document.getElementById("sendButton").onclick =
async function(){

if(!currentUser){
return;
}

const button =
document.getElementById("sendButton");

button.disabled = true;

button.textContent = "Sending...";

showLoading(
"Sending Verification Email...",
"Please wait while we send your verification email."
);

try{

const response = await fetch(
"https://us-central1-gedarak-26ca6.cloudfunctions.net/sendVerificationEmail",
{
method:"POST",
headers:{
"Content-Type":"application/json"
},
body:JSON.stringify({
email:currentUser.email,
uid:currentUser.uid
})
});

const result = await response.json();

hideLoading();

if(result.success){

document.getElementById("status").innerHTML =
"📧 Verification email sent successfully.<br>Please check your Inbox and Spam folder.";

document.getElementById("status").style.color =
"#0d6efd";

button.textContent =
"Verification Email Sent";

button.disabled = true;

button.style.opacity = "0.6";

button.style.cursor = "not-allowed";

}
else{

throw new Error(result.message);

}

}
catch(error){

console.log(error);

hideLoading();

showAlert(
"Verification Failed",
"We couldn't send the verification email. This usually happens if your email address is invalid or no longer exists. Please check your email address in your account settings and try again.",
"error"
);

document.getElementById("status").innerHTML =
"❌ Verification email could not be sent.";

document.getElementById("status").style.color =
"red";

button.disabled = false;

button.textContent =
"Send Verification Email";

}
};

function showLoading(
title="Loading...",
text="Please wait..."
){

document.getElementById("loadingTitle").textContent=title;

document.getElementById("loadingText").textContent=text;

document.getElementById("loadingAlert").style.display="flex";

}

function hideLoading(){

document.getElementById("loadingAlert").style.display="none";

}
function showAlert(title,message,type="warning"){

document.getElementById("alertTitle").textContent=title;

document.getElementById("alertMessage").textContent=message;

const icon=document.getElementById("alertIcon");

if(type==="success"){

icon.textContent="✅";

}
else if(type==="error"){

icon.textContent="❌";

}
else{

icon.textContent="⚠️";

}

document.getElementById("customAlert").style.display="flex";

}

function closeAlert(){

document.getElementById("customAlert").style.display="none";

}
</script>
<div id="loadingAlert"
style="
display:none;
position:fixed;
top:0;
left:0;
width:100%;
height:100%;
background:rgba(0,0,0,.45);
backdrop-filter:blur(4px);
justify-content:center;
align-items:center;
z-index:99998;
">

<div
style="
background:white;
width:90%;
max-width:360px;
padding:28px;
border-radius:20px;
text-align:center;
box-shadow:0 15px 40px rgba(0,0,0,.25);
">

<div
style="
font-size:55px;
animation:spin 1s linear infinite;
">
⏳
</div>

<h2 id="loadingTitle">
Sending Verification Email...
</h2>

<p id="loadingText">
Please wait...
</p>

</div>

</div>
<div id="customAlert"
style="
display:none;
position:fixed;
top:0;
left:0;
width:100%;
height:100%;
background:rgba(0,0,0,.45);
backdrop-filter:blur(4px);
justify-content:center;
align-items:center;
z-index:99999;
">

<div
style="
background:white;
width:90%;
max-width:380px;
padding:25px;
border-radius:20px;
text-align:center;
box-shadow:0 15px 40px rgba(0,0,0,.25);
">

<div id="alertIcon"
style="
font-size:45px;
margin-bottom:10px;
">
⚠️
</div>

<h2 id="alertTitle"
style="
margin:10px 0;
color:#222;
">
Warning
</h2>

<p id="alertMessage"
style="
color:#111;
font-size:18px;
line-height:1.5;
">
Message
</p>

<button
onclick="closeAlert()"
style="
margin-top:20px;
width:100%;
padding:13px;
border:none;
border-radius:12px;
background:#0d6efd;
color:white;
font-size:17px;
font-weight:bold;
cursor:pointer;
">
OK
</button>

</div>

</div>
</body>
</html>
