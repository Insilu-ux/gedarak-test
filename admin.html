<!DOCTYPE html>
<html>
    <head>
        <meta charset="UTF-8">

<meta name="viewport" content="width=device-width, initial-scale=1.0">
        <style>
            body{

font-family:Arial;

padding:30px;

max-width:1200px;

margin:auto;

}

.dashboard{

display:grid;

grid-template-columns:

repeat(auto-fit,minmax(220px,1fr));

gap:20px;

margin-top:30px;

margin-bottom:40px;

}

.card{

background:white;

border-radius:12px;

padding:30px;

text-align:center;

box-shadow:0 3px 12px rgba(0,0,0,.15);

}

.card h2{

font-size:40px;

margin:0;

}

.admin-buttons{

display:grid;

grid-template-columns:

repeat(auto-fit,minmax(220px,1fr));

gap:20px;

margin-top:30px;

}

.admin-buttons button{

padding:20px;

font-size:18px;

cursor:pointer;

border:none;

border-radius:10px;

}

#gedarakModal{

position:fixed;

top:0;
left:0;

width:100%;
height:100%;

background:rgba(0,0,0,.45);

display:none;

align-items:center;
justify-content:center;

z-index:999999;

}


.modal-box{

background:white;

width:90%;
max-width:420px;

padding:35px;

border-radius:20px;

text-align:center;

box-shadow:0 15px 40px rgba(0,0,0,.3);

animation:popup .25s ease;

}


.modal-box h2{

margin:0 0 15px;

font-size:26px;

}


.modal-box p{

font-size:22px;

font-weight:600;

color:#333;

line-height:1.5;

}


.modal-buttons{

display:flex;

gap:12px;

justify-content:center;

margin-top:25px;

}


.modal-buttons button{

padding:12px 25px;

border:none;

border-radius:12px;

font-size:16px;

font-weight:bold;

cursor:pointer;

}


.modal-ok{

background:#16a34a;

color:white;

}


.modal-later{

background:#e5e7eb;

color:#333;

}


@keyframes popup{

from{

transform:scale(.8);

opacity:0;

}

to{

transform:scale(1);

opacity:1;

}

}
        </style>
    </head>
   <body>

<a href="index.html">

<button class="home-btn">

💒 Home

</button>

</a>

<h1 style="text-align: center;">

Gedarak.lk Admin Dashboard

</h1>

<div class="dashboard">

<div class="card">

<h2 id="totalProperties">

0

</h2>

<p>🏠 Total Properties</p>

</div>

<div class="card">

<h2 id="liveProperties">

0

</h2>

<p>👀 Live Listings</p>

</div>

<div class="card">

<h2 id="totalReports">

0

</h2>

<p>🚩 Reports</p>

</div>

<div class="card">

<h2 id="totalUsers">

0

</h2>

<p>👤 Users</p>

</div>

</div>

<hr>

<h2>

Management

</h2>

<div class="admin-buttons">

<button onclick="location.href='admin-properties.html'">

🏠 Properties

</button>

<button onclick="location.href='admin-reports.html'">

🚩 Reports

</button>


</div>

     <div id="gedarakModal">

<div class="modal-box">

<h2 id="modalTitle">
Gedarak.lk
</h2>

<p id="modalMessage"></p>

<div class="modal-buttons">

<button
id="modalOk"
class="modal-ok">
OK
</button>

<button
id="modalLater"
class="modal-later">
Cancel
</button>

</div>

</div>

</div>

<script type="module">

    import { auth, db } from "./firebase-config.js";

import {
collection,
getDocs,
doc,
getDoc
}
from "https://www.gstatic.com/firebasejs/12.16.0/firebase-firestore.js";

import {
onAuthStateChanged
}
from "https://www.gstatic.com/firebasejs/12.16.0/firebase-auth.js";

onAuthStateChanged(auth, async(user)=>{

if(!user){

window.location.href="login.html";

return;

}

const userDoc = await getDoc(
doc(db,"users",user.uid)
);

if(
!userDoc.exists() ||
userDoc.data().role !== "Admin"
){

showAlert(
"⛔ Access Denied.\n\nOnly administrators can access this page.",
function(){
location.href="index.html";
},
true
);
return;

}

updateDashboard();

});

async function updateDashboard(){

const propertySnap =
await getDocs(
collection(db,"properties")
);

const userSnap =
await getDocs(
collection(db,"users")
);

const reportSnap =
await getDocs(
collection(db,"reports")
);

let properties = 0;
let live = 0;

propertySnap.forEach(doc=>{

properties++;

const p = doc.data();

if(p.hidden !== true){

live++;

}

});

document.getElementById("totalProperties").innerHTML =
properties;

document.getElementById("liveProperties").innerHTML =
live;

document.getElementById("totalUsers").innerHTML =
userSnap.size;

document.getElementById("totalReports").innerHTML =
reportSnap.size;

}
window.showAlert = function(
    message,
    okAction,
    hideLater = false,
    title = "Gedarak.lk"
){

    const modal =
    document.getElementById("gedarakModal");

    document.getElementById("modalTitle").textContent =
    title;

    document.getElementById("modalMessage").textContent =
    message;

    const laterBtn =
    document.getElementById("modalLater");

    laterBtn.style.display =
    hideLater ? "none" : "inline-block";

    modal.style.display = "flex";

    document.getElementById("modalOk").onclick = function(){

        modal.style.display = "none";

        if(okAction){

            okAction();

        }

    };

    laterBtn.onclick = function(){

        modal.style.display = "none";

    };

}


</script>

</body>
</html>
