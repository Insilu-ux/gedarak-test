<!DOCTYPE html>
<html>
    <head>
        <meta charset="UTF-8">

<meta name="viewport" content="width=device-width, initial-scale=1.0">
        <style>

body{

font-family:Arial,sans-serif;

max-width:1200px;

margin:auto;

padding:20px;

background:#f7f7f7;

}

h1{

font-size:34px;

font-weight:bold;

margin-bottom:5px;

}

.subtitle{

font-size:18px;

color:#666;

margin-bottom:30px;

line-height:1.6;

}

#topBar{

display:flex;

justify-content:space-between;

align-items:center;

flex-wrap:wrap;

gap:15px;

margin-bottom:25px;

}

#searchFavourite{

padding:12px;

font-size:16px;

width:260px;

border-radius:8px;

border:1px solid #ccc;

}

#sortFavourite{

padding:12px;

font-size:16px;

border-radius:8px;

}

#favouritesContainer{

display:grid;

grid-template-columns:

repeat(auto-fit,minmax(320px,1fr));

gap:25px;

}

.favouriteCard{

background:white;

border-radius:14px;

overflow:hidden;

box-shadow:0 3px 12px rgba(0,0,0,.12);

}

.favouriteCard img{

width:100%;

height:220px;

object-fit:cover;

}

.cardBody{

padding:18px;

}

.cardBody h2{

margin:0;

font-size:23px;

}

.cardBody p{

margin:8px 0;

font-size:17px;

}

.buttonRow{

display:flex;

gap:10px;

margin-top:20px;

flex-wrap:wrap;

}

.buttonRow button{

flex:1;

padding:12px;

font-size:16px;

border:none;

border-radius:8px;

cursor:pointer;

}

@media(max-width:600px){

body{

padding:12px;

}

h1{

font-size:28px;

}

.subtitle{

font-size:16px;

}

.cardBody h2{

font-size:20px;

}

.cardBody p{

font-size:16px;

}


}
        .pageHeader{

display:flex;

justify-content:center;

align-items:center;

margin-bottom:30px;

padding-bottom:15px;

border-bottom:1px solid #ddd;

}

.logoLink{

display:flex;

align-items:center;

gap:12px;

text-decoration:none;

color:black;

}

.pageLogo{

width:55px;

height:55px;

object-fit:contain;

}

.logoLink h2{

margin:0;

font-size:32px;

font-weight:bold;

color:#8b008b;

}

@media(max-width:600px){

.pageLogo{

width:42px;

height:42px;

}

.logoLink h2{

font-size:24px;

}

}
.tagline{

margin:0;

font-size:14px;

color:#666;

}
.propertyImageWrapper{
    position:relative;
    width:100%;
    height:320px;
    overflow:hidden;
}

.propertyWatermarkText{

position:absolute;

top:50%;

left:50%;

transform:translate(-50%,-50%);

font-size:34px;

font-weight:800;

letter-spacing:3px;

color:white;

opacity:.14;

text-shadow:
0 0 10px rgba(0,0,0,.6);

pointer-events:none;

user-select:none;

white-space:nowrap;

}

.propertyImageWrapper img{
    width:100%;
    height:100%;
    display:block;
    object-fit:cover;
}
#favouritesLoadingOverlay{

    position:fixed;

    inset:0;

    background:rgba(0,0,0,.45);

    display:flex;

    justify-content:center;

    align-items:center;

    z-index:9999999;

}


.favourites-loading-box{

    background:white;

    width:90%;

    max-width:420px;

    padding:35px;

    border-radius:20px;

    text-align:center;

    box-shadow:0 15px 40px rgba(0,0,0,.3);

    animation:favouritesPopup .25s ease;

}


.favourites-loading-logo{

    font-size:38px;

    margin-bottom:8px;

}


.favourites-loading-box h2{

    margin:0;

    color:#8b008b;

    font-size:20px;

}


.favourites-loading-box p{

    margin:8px 0 18px;

    color:#0c0c0c;

    font-size:18px;

}


.favourites-loading-spinner{

    width:28px;

    height:28px;

    margin:auto;

    border:3px solid #e5e7eb;

    border-top:3px solid #8b008b;

    border-radius:50%;

    animation:favouritesLoadingSpin .8s linear infinite;

}


@keyframes favouritesPopup{

    from{

        transform:scale(.8);

        opacity:0;

    }

    to{

        transform:scale(1);

        opacity:1;

    }

}


@keyframes favouritesLoadingSpin{

    to{

        transform:rotate(360deg);

    }

}

</style>
        <title>My Favourites</title>
       <!-- Basic SEO -->
<meta name="description" content="Gedarak.lk - Sri Lanka's property marketplace. Buy, sell and discover houses, apartments, lands and properties easily.">

<meta name="keywords" content="Gedarak, Gedarak.lk, Sri Lanka property, houses for sale Sri Lanka, apartments, lands, real estate Sri Lanka">

<meta name="author" content="Gedarak.lk">


<!-- Browser / Mobile -->
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<meta name="theme-color" content="#8b008b">


<!-- Favicon -->
<link rel="icon" type="image/png" sizes="32x32" href="favicon.png">

<link rel="icon" type="image/png" sizes="16x16" href="favicon.png">

<link rel="preload" href="favicon.png" as="image">

<link rel="canonical" href="https://gedarak.lk">
        </head>
        <body>
    <a href="index.html">
        <button class="home-btn">
        💒 Home
        </button>
    </a>
<div id="favouritesLoadingOverlay">

    <div class="favourites-loading-box">

        <div class="favourites-loading-logo">
            💗
        </div>

        <h2>Please wait a moment.</h2>

        <p>Loading your favourite properties...</p>

        <div class="favourites-loading-spinner"></div>

    </div>

</div>

       <header class="pageHeader">

<a href="index.html" class="logoLink">

<img
src="favicon.png"
class="pageLogo">

<div>

<h2>

Gedarak.lk

</h2>

<p class="tagline">

Sri Lanka's Property Marketplace

</p>

</div>

</a>

</header>
      <h1 style="text-align: center;">💗 My Favourite Properties</h1>

<p class="subtitle" style="text-align: center;">

Save properties you're interested in and access them anytime after logging in.

</p>

<div id="topBar">

<h3>

Saved Properties:

<span id="favouriteCount"></span>

</h3>

<div
style="
display:flex;
align-items:center;
gap:10px;
flex-wrap:wrap;
">

<input
id="searchFavourite"
placeholder="Search favourites..."
onkeyup="searchFavourite()">

<select
id="sortFavourite"
onchange="sortFavourite()">

<option value="newest">

Newest

</option>

<option value="oldest">

Oldest

</option>

<option value="low">

Lowest Price

</option>

<option value="high">

Highest Price

</option>

</select>

</div>

</div>
      <div id="favouritesContainer"></div>
<script type="module">

import { auth, db } from "./firebase-config.js";

import {
    collection,
    getDocs,
    doc,
    getDoc,
    updateDoc
}
from "https://www.gstatic.com/firebasejs/12.16.0/firebase-firestore.js";

import {
    onAuthStateChanged
}
from "https://www.gstatic.com/firebasejs/12.16.0/firebase-auth.js";


let currentUser = null;

let favouriteIds = [];

let favourites = [];

let allFavouriteProperties = [];


/*
==========================================
AUTHENTICATION
==========================================
*/

onAuthStateChanged(auth, async function(user){

    /*
    ==========================================
    NOT LOGGED IN
    ==========================================
    */

    if(!user){

        document.getElementById(
            "favouritesContainer"
        ).innerHTML = `

        <div
        style="
        text-align:center;
        padding:70px;
        ">

        <h2>
        Please log in first.
        </h2>

        <p>
        Your favourite properties are securely linked to your account.
        </p>

        <br>

        <button
        onclick="window.location.href='login.html'"
        style="
        padding:14px 28px;
        border:none;
        border-radius:12px;
        background:#2563eb;
        color:white;
        font-size:16px;
        font-weight:700;
        cursor:pointer;
        ">

        Login

        </button>

        </div>

        `;

        hideFavouritesLoader();

        return;
    }


    currentUser = user;


    /*
    ==========================================
    LOAD USER FAVOURITES
    ==========================================
    */

    try{

        const userSnap =
            await getDoc(
                doc(
                    db,
                    "users",
                    user.uid
                )
            );


        if(userSnap.exists()){

            favouriteIds =
                userSnap.data().favourites || [];

        }
        else{

            favouriteIds = [];

        }


        await loadFavourites();

    }


    /*
    ==========================================
    ERROR
    ==========================================
    */

    catch(error){

        console.error(
            "Error loading favourites:",
            error
        );


        document.getElementById(
            "favouritesContainer"
        ).innerHTML = `

        <div
        style="
        text-align:center;
        padding:70px;
        ">

        <div
        style="
        font-size:70px;
        margin-bottom:15px;
        ">
        ⚠️
        </div>


        <h2>
        Unable to Load Favourites
        </h2>


        <p
        style="
        font-size:18px;
        color:#666;
        line-height:1.8;
        ">

        We couldn't load your favourite properties right now.

        Please check your internet connection and try again.

        </p>


        <br>


        <button
        onclick="location.reload()"
        style="
        padding:14px 28px;
        border:none;
        border-radius:12px;
        background:#8b008b;
        color:white;
        font-size:16px;
        font-weight:700;
        cursor:pointer;
        ">

        🔄 Try Again

        </button>

        </div>

        `;

    }


    finally{

        hideFavouritesLoader();

    }

});



/*
==========================================
LOAD FAVOURITE PROPERTIES
==========================================
*/

async function loadFavourites(){

    favourites = [];


    const snapshot =
        await getDocs(
            collection(
                db,
                "properties"
            )
        );


    snapshot.forEach(function(docSnap){

        const property = {

            id:docSnap.id,

            ...docSnap.data()

        };


        if(
            favouriteIds.includes(
                String(property.id)
            )
        ){

            favourites.push(property);

        }

    });


    allFavouriteProperties =
        [...favourites];


    document.getElementById(
        "favouriteCount"
    ).innerHTML =
        favourites.length;


    /*
    ==========================================
    NO FAVOURITES
    ==========================================
    */

    if(favourites.length === 0){

        document.getElementById(
            "favouritesContainer"
        ).innerHTML = `

        <div
        style="
        text-align:center;
        padding:70px;
        ">

        <h2>
        ❤ No favourite properties yet
        </h2>

        <p>
        Tap the heart icon on any property to save it here.
        </p>

        <br>

        <button
        onclick="window.location.href='index.html'"
        style="
        padding:14px 28px;
        border:none;
        border-radius:12px;
        background:#2563eb;
        color:white;
        font-size:16px;
        font-weight:700;
        cursor:pointer;
        ">

        🏠 Browse Properties

        </button>

        </div>

        `;

        return;

    }


    renderFavourites(
        favourites
    );

}



/*
==========================================
RENDER FAVOURITES
==========================================
*/

function renderFavourites(list){

    let html = "";


    list.forEach(function(property){

        const image =
            property.images?.[0] ||
            "favicon.png";


        html += `

        <div class="favouriteCard">

        <div class="cardBody">


        <div class="propertyImageWrapper">

        <img
        src="${image}"
        alt="${property.name || "Property"}">

        <div class="propertyWatermarkText">
        Gedarak.lk
        </div>

        </div>


        <h2>
        ${property.name || "Unnamed Property"}
        </h2>


        <p>
        Property Type:
        ${property.propertyType || "Property"}
        </p>


        <h3>

        ${
            property.negotiable

            ?

            "💬 Negotiable"

            :

            "💸 Rs. " +
            Number(
                property.price || 0
            ).toLocaleString()

        }

        </h3>


        <p>

        ${property.city || ""},

        ${property.district || ""}

        </p>


       ${
    property.propertyType === "Land"

    ?

    `
    <p>
    🌳 ${property.perches || 0} Perches
    </p>
    `

    :

    [
        "House",
        "Apartment",
        "Villa",
        "Annex",
        "Bungalow",
        "Hotel"
    ].includes(property.propertyType)

    ?

    `
    <p>
    🛏 ${property.bedrooms || 0} Bedrooms
    </p>

    <p>
    🛁 ${property.bathrooms || 0} Bathrooms
    </p>

    <p>
    📐 ${Number(
        property.squareFeet || 0
    ).toLocaleString()} Sqft
    </p>

    <p>
    🌳 ${property.perches || 0} Perches
    </p>
    `

    :

    `
    <p>
    📐 ${Number(
        property.squareFeet || 0
    ).toLocaleString()} Sqft
    </p>

    <p>
    🌳 ${property.perches || 0} Perches
    </p>
    `
}


        <div class="buttonRow">


        <button
        onclick="viewProperty('${property.id}')"
        style="
        padding:13px;
        border:none;
        border-radius:12px;
        background:#16a34a;
        color:white;
        font-size:16px;
        font-weight:700;
        cursor:pointer;
        box-shadow:0 4px 10px rgba(22,163,74,.25);
        transition:.25s;
        ">

        👁 View Property

        </button>


        <button
        onclick="removeFavourite('${property.id}')"
        style="
        padding:13px;
        border:none;
        border-radius:12px;
        background:#ef4444;
        color:white;
        font-size:16px;
        font-weight:700;
        cursor:pointer;
        box-shadow:0 4px 10px rgba(239,68,68,.25);
        transition:.25s;
        ">

        🤍 Remove

        </button>


        </div>


        </div>

        </div>

        `;

    });


    document.getElementById(
        "favouritesContainer"
    ).innerHTML =
        html;

}



/*
==========================================
VIEW PROPERTY
==========================================
*/

function viewProperty(id){

    window.location.href =
        `property.html?id=${id}`;

}



/*
==========================================
REMOVE FAVOURITE
==========================================
*/

async function removeFavourite(id){

    try{

        favouriteIds =
            favouriteIds.filter(
                x =>
                    x !== String(id)
            );


        await updateDoc(

            doc(
                db,
                "users",
                currentUser.uid
            ),

            {
                favourites:
                    favouriteIds
            }

        );


        await loadFavourites();

    }


    catch(error){

        console.error(
            "Error removing favourite:",
            error
        );

        alert(
            "Unable to remove this favourite right now. Please try again."
        );

    }

}



/*
==========================================
SEARCH
==========================================
*/

function searchFavourite(){

    let text =

        document.getElementById(
            "searchFavourite"
        ).value.toLowerCase();


    let filtered =

        allFavouriteProperties.filter(
            function(p){

                return(

                    (p.name || "")
                        .toLowerCase()
                        .includes(text)

                    ||

                    (p.city || "")
                        .toLowerCase()
                        .includes(text)

                    ||

                    (p.district || "")
                        .toLowerCase()
                        .includes(text)

                    ||

                    (p.propertyType || "")
                        .toLowerCase()
                        .includes(text)

                );

            }
        );


    renderFavourites(
        filtered
    );

}



/*
==========================================
SORT
==========================================
*/

function sortFavourite(){

    let value =

        document.getElementById(
            "sortFavourite"
        ).value;


    let sorted =

        [...allFavouriteProperties];


    if(value == "low"){

        sorted.sort(
            (a,b) =>
                Number(a.price || 0) -
                Number(b.price || 0)
        );

    }


    if(value == "high"){

        sorted.sort(
            (a,b) =>
                Number(b.price || 0) -
                Number(a.price || 0)
        );

    }


    if(value == "newest"){

        sorted.sort(
            (a,b) =>
                (b.createdAt?.seconds || 0) -
                (a.createdAt?.seconds || 0)
        );

    }


    if(value == "oldest"){

        sorted.sort(
            (a,b) =>
                (a.createdAt?.seconds || 0) -
                (b.createdAt?.seconds || 0)
        );

    }


    renderFavourites(
        sorted
    );

}



/*
==========================================
HIDE LOADING POPUP
==========================================
*/

function hideFavouritesLoader(){

    const loader =

        document.getElementById(
            "favouritesLoadingOverlay"
        );


    if(loader){

        loader.style.display =
            "none";

    }

}



/*
==========================================
GLOBAL FUNCTIONS
==========================================
*/

window.viewProperty =
    viewProperty;

window.removeFavourite =
    removeFavourite;

window.searchFavourite =
    searchFavourite;

window.sortFavourite =
    sortFavourite;

window.renderFavourites =
    renderFavourites;

</script>
    </body>
</html>
