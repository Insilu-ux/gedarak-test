<!DOCTYPE html>
<html>

<head>
<meta charset="UTF-8">

<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>

Manage Reports

</title>

<link rel="stylesheet" href="style.css">

<style>

body{

font-family:Arial;

padding:30px;

max-width:1400px;

margin:auto;

}

table{

width:100%;

border-collapse:collapse;

margin-top:20px;

}

th{

background:#009688;

color:white;

padding:12px;

}

td{

padding:12px;

border-bottom:1px solid #ddd;

vertical-align:top;

}

button{

padding:8px 15px;

border:none;

cursor:pointer;

border-radius:8px;

margin:2px;

background:#009688;

color:white;

font-weight:bold;

transition:.2s;

}

button:hover{

background:#00796b;

}

textarea{

width:100%;

}

#gedarakModal{

position:fixed;

top:0;
left:0;

width:100%;
height:100%;

background:rgba(0,0,0,.45);

display:none;

align-items:center;
justify-content:center;

z-index:999999;

}


.modal-box{

background:white;

width:90%;
max-width:420px;

padding:35px;

border-radius:20px;

text-align:center;

box-shadow:0 15px 40px rgba(0,0,0,.3);

animation:popup .25s ease;

}


.modal-box h2{

margin:0 0 15px;

font-size:26px;

}


.modal-box p{

font-size:22px;

font-weight:600;

color:#333;

line-height:1.5;

}


.modal-buttons{

display:flex;

gap:12px;

justify-content:center;

margin-top:25px;

}


.modal-buttons button{

padding:12px 25px;

border:none;

border-radius:12px;

font-size:16px;

font-weight:bold;

cursor:pointer;

}


.modal-ok{

background:#16a34a;

color:white;

}


.modal-later{

background:#e5e7eb;

color:#333;

}


@keyframes popup{

from{

transform:scale(.8);

opacity:0;

}

to{

transform:scale(1);

opacity:1;

}

}
.report-search{

width:420px;

height:45px;

padding:0 15px;

font-size:17px;

border:1px solid #ccc;

border-radius:10px;

outline:none;

}
.report-filter{

width:220px;

height:42px;

padding:0 12px;

font-size:16px;

border-radius:10px;

border:1px solid #ccc;

cursor:pointer;

}

</style>

</head>

<body>

<a href="admin.html">

<button>

⬅ Dashboard

</button>

</a>

<h1>

Reports

</h1>

<input

id="searchReport"

placeholder="Search reports..."

onkeyup="loadReports()"

class="report-search">

<br><br>

<select

id="statusFilter"

onchange="loadReports()"

class="report-filter">

<option value="">

All Reports

</option>

<option>

Pending

</option>

<option>

Solved

</option>

</select>

<br><br>
<table>

<thead>

<tr>

<th>Name</th>

<th>Problem</th>

<th>Property</th>

<th>Date</th>

<th>Screenshot</th>

<th>Status</th>

<th>Actions</th>

</tr>

</thead>

<tbody id="reportTable">

</tbody>

</table>
     <div id="gedarakModal">

<div class="modal-box">

<h2 id="modalTitle">
Gedarak.lk
</h2>

<p id="modalMessage"></p>

<div class="modal-buttons">

<button
id="modalOk"
class="modal-ok">
OK
</button>

<button
id="modalLater"
class="modal-later">
Cancel
</button>

</div>

</div>

</div>

<script type="module">

    import { auth, db } from "./firebase-config.js";

import {
collection,
getDocs,
updateDoc,
deleteDoc,
doc,
getDoc
}
from "https://www.gstatic.com/firebasejs/12.16.0/firebase-firestore.js";

import {
onAuthStateChanged
}
from "https://www.gstatic.com/firebasejs/12.16.0/firebase-auth.js";

onAuthStateChanged(auth,async(user)=>{

if(!user){

location.href="login.html";
return;

}

const userSnap =
await getDoc(doc(db,"users",user.uid));

if(!userSnap.exists() ||
userSnap.data().role!=="Admin"){

showAlert(
"⛔ Access Denied.\n\nOnly administrators can access this page.",
function(){
location.href="index.html";
},
true
);
return;

}

loadReports();

});

async function loadReports(){

const snapshot =

await getDocs(collection(db,"reports"));

const reports=[];

snapshot.forEach(d=>{

reports.push({

docId:d.id,
...d.data()

});

});

let search=

document.getElementById(

"searchReport"

).value.toLowerCase();

let status=

document.getElementById(

"statusFilter"

).value;

let table=

document.getElementById("reportTable");

table.innerHTML="";

reports.forEach(function(report,index){

    let searchable=(

report.name+" "+

report.email+" "+

report.type+" "+

report.property+" "+

report.message

).toLowerCase();

if(

!searchable.includes(search)

){

return;

}

if(

status!="" &&

(report.status || "Pending")!=status

){

return;

}

table.innerHTML+=`

<tr>

<td>

<div
style="
max-width:180px;
max-height:70px;
overflow:auto;
font-weight:bold;
word-break:break-word;
">

${report.name}

</div>

<br>

<div
style="
word-break:break-word;
">

${report.email}

</div>

</td>

<td>

<span

style="

display:inline-block;

max-width:150px;

padding:8px 12px;

border-radius:8px;

font-weight:bold;

background:

${report.type=="Scam / Fraud"

?"#ffb3b3":

report.type=="Bug / Error"

?"#ffe599":

report.type=="Suggestion"

?"#b6d7ff":

"#dddddd"};

word-break:break-word;

white-space:normal;

text-align:center;

">

${report.type}

</span>

<br><br>

<div
style="
max-height:170px;
overflow-y:auto;
padding:8px;
margin-top:10px;
border:1px solid #ddd;
border-radius:8px;
background:#fafafa;
white-space:pre-wrap;
word-break:break-word;
">

${report.message}

</div>

</td>

<td>

${report.property || "-"}

<br><br>

<button

onclick="findProperty('${report.property}')">

Open

</button>

</td>

<td>

${report.date}

</td>


<td>

${report.image ?

`
<img

src="${report.image}"

onclick="openImage('${report.image}')"

style="
width:90px;
height:70px;
object-fit:cover;
border-radius:8px;
cursor:pointer;
border:1px solid #ccc;
">

`

:

"No Image"

}

</td>

<td>

<span
style="
font-weight:bold;
color:
${report.status=="Solved" ? "green" : "red"};
">

${report.status || "Pending"}

</span>

</td>

<td>

<button
style="background:#2e7d32;color:white;"
onclick="solveReport('${report.docId}')">
✔ Mark Solved
</button>

<button
style="background:#d32f2f;color:white;"
onclick="deleteReport('${report.docId}')">
🗑 Delete
</button>

</td>

</tr>

`;

});

}

async function solveReport(docId){

await updateDoc(

doc(db,"reports",docId),

{
status:"Solved"
}

);

loadReports();

showAlert(

"✅ Report marked as solved.",

null,

true,

"Success"

);

}

async function deleteReport(docId){

showAlert(

"🗑 Delete this report permanently?",

async function(){

await deleteDoc(
doc(db,"reports",docId)
);

loadReports();

showAlert(

"🗑 Report deleted successfully.",

null,

true,

"Deleted"

);

},

false,

"Delete Report"

);

}
async function findProperty(name){

const snapshot =
await getDocs(collection(db,"properties"));

let found=false;

snapshot.forEach(d=>{

const p=d.data();

if(
(p.name || "").trim().toLowerCase() ===
(name || "").trim().toLowerCase()
){

found=true;

window.location.href=
"property.html?id="+d.id;

}

});

if(!found){

showAlert(
"🏠 Property not found.",
null,
true
);

}

}

function openImage(src){

document.getElementById(
"popupImage"
).src = src;

document.getElementById(
"imagePopup"
).style.display="flex";

}

function closeImage(){

document.getElementById("imagePopup").style.display="none";

const image =
document.getElementById("popupImage");

image.style.transform="scale(1)";

image.style.cursor="zoom-in";

zoomed=false;

}
let zoomed = false;

function zoomImage(){

let image =
document.getElementById("popupImage");

if(!zoomed){

image.style.transform = "scale(2)";
image.style.cursor = "zoom-out";

zoomed = true;

}
else{

image.style.transform = "scale(1)";
image.style.cursor = "zoom-in";

zoomed = false;

}

}

 window.showAlert = function(
    message,
    okAction,
    hideLater = false,
    title = "Gedarak.lk"
){

    const modal =
    document.getElementById("gedarakModal");

    document.getElementById("modalTitle").textContent =
    title;

    document.getElementById("modalMessage").textContent =
    message;

    const laterBtn =
    document.getElementById("modalLater");

    laterBtn.style.display =
    hideLater ? "none" : "inline-block";

    modal.style.display = "flex";

    document.getElementById("modalOk").onclick = function(){

        modal.style.display = "none";

        if(okAction){

            okAction();

        }

    };

    laterBtn.onclick = function(){

        modal.style.display = "none";

    };

}


window.solveReport = solveReport;
window.deleteReport = deleteReport;
window.findProperty = findProperty;
window.openImage = openImage;
window.closeImage = closeImage;
window.zoomImage = zoomImage;
window.loadReports = loadReports;

</script>

<div

id="imagePopup"
onclick="closeImage()"
style="
display:none;
position:fixed;
top:0;
left:0;
width:100%;
height:100%;
background:rgba(0,0,0,.88);
justify-content:center;
align-items:center;
z-index:99999;
transition:.25s;
cursor:zoom-in;
">

<img
id="popupImage"

onclick="
event.stopPropagation();
zoomImage();
"

style="
width:auto;
height:auto;

width:95vw;
height:95vh;


object-fit:contain;

border-radius:12px;

box-shadow:0 0 40px rgba(255,255,255,.35);
">

<div

onclick="closeImage()"

style="
position:absolute;
top:25px;
right:35px;
font-size:42px;
color:white;
cursor:pointer;
font-weight:bold;
">

×

</div>

</div>

</body>

</html>
