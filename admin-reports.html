<!DOCTYPE html>
<html>

<head>
<meta charset="UTF-8">

<meta name="viewport" content="width=device-width, initial-scale=1.0">
       <meta name="robots" content="noindex, nofollow">
<title>

Manage Reports

</title>

<link rel="stylesheet" href="style.css">

<style>

body{

font-family:Arial;

padding:30px;

max-width:1400px;

margin:auto;

}

table{

width:100%;

border-collapse:collapse;

margin-top:20px;

}

th{

background:#009688;

color:white;

padding:12px;

}

td{

padding:12px;

border-bottom:1px solid #ddd;

vertical-align:top;

}

button{

padding:8px 15px;

border:none;

cursor:pointer;

border-radius:8px;

margin:2px;

background:#009688;

color:white;

font-weight:bold;

transition:.2s;

}

button:hover{

background:#00796b;

}

textarea{

width:100%;

}

#gedarakModal{

position:fixed;

top:0;
left:0;

width:100%;
height:100%;

background:rgba(0,0,0,.45);

display:none;

align-items:center;
justify-content:center;

z-index:999999;

}


.modal-box{

background:white;

width:90%;
max-width:420px;

padding:35px;

border-radius:20px;

text-align:center;

box-shadow:0 15px 40px rgba(0,0,0,.3);

animation:popup .25s ease;

}


.modal-box h2{

margin:0 0 15px;

font-size:26px;

}


.modal-box p{

font-size:22px;

font-weight:600;

color:#333;

line-height:1.5;

}


.modal-buttons{

display:flex;

gap:12px;

justify-content:center;

margin-top:25px;

}


.modal-buttons button{

padding:12px 25px;

border:none;

border-radius:12px;

font-size:16px;

font-weight:bold;

cursor:pointer;

}


.modal-ok{

background:#16a34a;

color:white;

}


.modal-later{

background:#e5e7eb;

color:#333;

}


@keyframes popup{

from{

transform:scale(.8);

opacity:0;

}

to{

transform:scale(1);

opacity:1;

}

}
.report-search{

width:420px;

height:45px;

padding:0 15px;

font-size:17px;

border:1px solid #ccc;

border-radius:10px;

outline:none;

}
.report-filter{

width:220px;

height:42px;

padding:0 12px;

font-size:16px;

border-radius:10px;

border:1px solid #ccc;

cursor:pointer;

}

#reportsLoading{

position:fixed;

top:0;
left:0;

width:100%;
height:100%;

background:rgba(0,0,0,.35);

display:flex;

align-items:center;
justify-content:center;

z-index:999998;

}

.reports-loading-box{

background:white;

padding:25px 35px;

border-radius:16px;

text-align:center;

box-shadow:0 10px 35px rgba(0,0,0,.25);

min-width:250px;

}

.reports-spinner{

width:38px;
height:38px;

border:4px solid #ddd;

border-top:4px solid #009688;

border-radius:50%;

animation:reportsSpin .8s linear infinite;

margin:0 auto 15px;

}

.reports-loading-box h3{

margin:0 0 8px;

font-size:20px;

}

.reports-loading-box p{

margin:0;

color:#666;

font-size:14px;

}

@keyframes reportsSpin{

from{
transform:rotate(0deg);
}

to{
transform:rotate(360deg);
}

}

</style>

</head>

<body>

<div id="reportsLoading">

    <div class="reports-loading-box">

        <div class="reports-spinner"></div>

        <h3>Loading Reports</h3>

        <p>Please wait...</p>

    </div>

</div>

<a href="admin.html">

<button>

⬅ Dashboard

</button>

</a>

<h1>

Reports

</h1>

<input

id="searchReport"

placeholder="Search reports..."

onkeyup="loadReports()"

class="report-search">

<br><br>

<select

id="statusFilter"

onchange="loadReports()"

class="report-filter">

<option value="">

All Reports

</option>

<option>

Pending

</option>

<option>

Solved

</option>

</select>

<br><br>
<table>

<thead>

<tr>

<th>Name</th>

<th>Problem</th>

<th>Property</th>

<th>Date</th>

<th>Screenshot</th>

<th>Status</th>

<th>Actions</th>

</tr>

</thead>

<tbody id="reportTable">

</tbody>

</table>
     <div id="gedarakModal">

<div class="modal-box">

<h2 id="modalTitle">
Gedarak.lk
</h2>

<p id="modalMessage"></p>

<div class="modal-buttons">

<button
id="modalOk"
class="modal-ok">
OK
</button>

<button
id="modalLater"
class="modal-later">
Cancel
</button>

</div>

</div>

</div>

<script type="module">

    import { auth, db } from "./firebase-config.js";

import {
collection,
getDocs,
updateDoc,
deleteDoc,
doc,
getDoc
}
from "https://www.gstatic.com/firebasejs/12.16.0/firebase-firestore.js";

import {
onAuthStateChanged
}
from "https://www.gstatic.com/firebasejs/12.16.0/firebase-auth.js";

onAuthStateChanged(auth,async(user)=>{

if(!user){

location.href="login.html";
return;

}

const userSnap =
await getDoc(doc(db,"users",user.uid));

if(!userSnap.exists() ||
userSnap.data().role!=="Admin"){

showAlert(
"⛔ Access Denied.\n\nOnly administrators can access this page.",
function(){
location.href="index.html";
},
true
);
return;

}

loadReports();

});

function formatReportDate(timestamp) {

    if (!timestamp) {
        return "-";
    }

    let date;

    // Firestore Timestamp
    if (typeof timestamp.toDate === "function") {

        date = timestamp.toDate();

    }

    // Firestore timestamp represented as seconds/nanoseconds
    else if (
        typeof timestamp.seconds === "number"
    ) {

        date = new Date(
            timestamp.seconds * 1000
        );

    }

    // Normal JavaScript Date
    else if (timestamp instanceof Date) {

        date = timestamp;

    }

    // String date
    else {

        date = new Date(timestamp);

    }

    if (isNaN(date.getTime())) {
        return "-";
    }

    return date.toLocaleString("en-LK", {
        year: "numeric",
        month: "short",
        day: "numeric",
        hour: "2-digit",
        minute: "2-digit",
        second: "2-digit",
        hour12: true,
        timeZone: "Asia/Colombo"
    });

}

async function loadReports(){

    const table =
        document.getElementById("reportTable");

    const searchInput =
        document.getElementById("searchReport");

    const statusInput =
        document.getElementById("statusFilter");

    const loadingOverlay =
        document.getElementById("reportsLoading");


    /* =====================================================
       GET SEARCH + FILTER VALUES
       ===================================================== */

    const search =
        searchInput.value
            .trim()
            .toLowerCase();

    const status =
        statusInput.value;


    /* =====================================================
       SHOW TABLE LOADING
       ===================================================== */

    table.innerHTML = `

        <tr>

            <td
                colspan="7"
                style="
                    text-align:center;
                    padding:45px;
                    font-size:18px;
                    color:#666;
                "
            >

                <div
                    class="reports-spinner"
                    style="
                        margin:0 auto 15px;
                    "
                ></div>

                <strong>
                    Loading reports...
                </strong>

                <div
                    style="
                        margin-top:8px;
                        font-size:14px;
                        color:#999;
                    "
                >
                    Please wait while we retrieve the reports.
                </div>

            </td>

        </tr>

    `;


    try {

        /* =================================================
           GET REPORTS FROM FIRESTORE
           ================================================= */

        const snapshot =
            await getDocs(
                collection(db, "reports")
            );


        const reports = [];


        snapshot.forEach(d => {

            reports.push({

                docId: d.id,

                ...d.data()

            });

        });


        table.innerHTML = "";


        let visibleReports = 0;


        /* =================================================
           DISPLAY REPORTS
           ================================================= */

        reports.forEach(function(report){

            const searchable = (

                (report.name || "") + " " +

                (report.email || "") + " " +

                (report.phone || "") + " " +

                (report.type || "") + " " +

                (report.property || "") + " " +

                (report.message || "") + " " +

                (report.id || "")

            ).toLowerCase();


            /* SEARCH */

            if(
                search &&
                !searchable.includes(search)
            ){

                return;

            }


            /* STATUS FILTER */

            if(
                status !== "" &&
                (report.status || "Pending") !== status
            ){

                return;

            }


            visibleReports++;


            /* =================================================
               PROBLEM TYPE STYLE
               ================================================= */

            let typeBackground = "#dddddd";


            if(report.type === "Scam / Fraud"){

                typeBackground = "#ffb3b3";

            }

            else if(report.type === "Bug / Error"){

                typeBackground = "#ffe599";

            }

            else if(report.type === "Suggestion"){

                typeBackground = "#b6d7ff";

            }


            /* =================================================
               ADD ROW
               ================================================= */

            table.innerHTML += `

                <tr>

                    <!-- NAME / EMAIL -->

                    <td>

                        <div
                            style="
                                max-width:180px;
                                max-height:70px;
                                overflow:auto;
                                font-weight:bold;
                                word-break:break-word;
                            "
                        >

                            ${report.name || "-"}

                        </div>

                        <br>

                        <div
                            style="
                                word-break:break-word;
                            "
                        >

                            ${report.email || "-"}

                        </div>

                        ${
                            report.phone
                            ?
                            `
                            <br>

                            <div
                                style="
                                    color:#666;
                                    font-size:14px;
                                "
                            >

                                ${report.phone}

                            </div>
                            `
                            :
                            ""
                        }

                    </td>


                    <!-- PROBLEM -->

                    <td>

                        <span
                            style="
                                display:inline-block;
                                max-width:150px;
                                padding:8px 12px;
                                border-radius:8px;
                                font-weight:bold;
                                background:${typeBackground};
                                word-break:break-word;
                                white-space:normal;
                                text-align:center;
                            "
                        >

                            ${report.type || "-"}

                        </span>


                        <br><br>


                        <div
                            style="
                                max-height:170px;
                                overflow-y:auto;
                                padding:8px;
                                margin-top:10px;
                                border:1px solid #ddd;
                                border-radius:8px;
                                background:#fafafa;
                                white-space:pre-wrap;
                                word-break:break-word;
                            "
                        >

                            ${report.message || "-"}

                        </div>

                    </td>


                    <!-- PROPERTY -->

                    <td>

                        ${
                            report.property
                            ?
                            `
                            <div
                                style="
                                    max-width:220px;
                                    word-break:break-word;
                                "
                            >

                                ${report.property}

                            </div>

                            <br>

                            <button
                                onclick="findProperty('${String(report.property).replace(/'/g, "\\'")}')"
                            >

                                Open

                            </button>
                            `
                            :
                            "-"
                        }

                    </td>


                    <!-- DATE -->

                    <td>

                        ${formatReportDate(report.date)}

                    </td>


                    <!-- SCREENSHOT -->

                    <td>

                        ${
                            report.image

                            ?

                            `
                            <img
                                src="${report.image}"
                                onclick="openImage('${report.image}')"
                                style="
                                    width:90px;
                                    height:70px;
                                    object-fit:cover;
                                    border-radius:8px;
                                    cursor:pointer;
                                    border:1px solid #ccc;
                                "
                            >
                            `

                            :

                            `
                            <span
                                style="
                                    color:#999;
                                "
                            >

                                No Image

                            </span>
                            `
                        }

                    </td>


                    <!-- STATUS -->

                    <td>

                        <span
                            style="
                                font-weight:bold;
                                color:
                                ${
                                    report.status === "Solved"
                                    ?
                                    "green"
                                    :
                                    "red"
                                };
                            "
                        >

                            ${report.status || "Pending"}

                        </span>

                    </td>


                    <!-- ACTIONS -->

                    <td>

                        <button
                            style="
                                background:#2e7d32;
                                color:white;
                            "
                            onclick="solveReport('${report.docId}')"
                        >

                            ✔ Mark Solved

                        </button>


                        <button
                            style="
                                background:#d32f2f;
                                color:white;
                            "
                            onclick="deleteReport('${report.docId}')"
                        >

                            🗑 Delete

                        </button>

                    </td>

                </tr>

            `;

        });


        /* =================================================
           NO RESULTS
           ================================================= */

        if(visibleReports === 0){

            table.innerHTML = `

                <tr>

                    <td
                        colspan="7"
                        style="
                            text-align:center;
                            padding:40px;
                            color:#777;
                            font-size:17px;
                        "
                    >

                        ${
                            search || status

                            ?

                            "🔎 No reports match your search or filter."

                            :

                            "📭 No reports have been submitted yet."

                        }

                    </td>

                </tr>

            `;

        }


        /* =================================================
           HIDE INITIAL FULL-SCREEN LOADING
           ================================================= */

        if(loadingOverlay){

            loadingOverlay.style.display = "none";

        }

    }


    catch(error){

        console.error(
            "Error loading reports:",
            error
        );


        table.innerHTML = `

            <tr>

                <td
                    colspan="7"
                    style="
                        text-align:center;
                        padding:40px;
                        color:#b00020;
                        font-size:17px;
                    "
                >

                    ❌ Unable to load reports.

                    <br><br>

                    <span
                        style="
                            font-size:14px;
                            color:#777;
                        "
                    >

                        Please check your internet connection
                        and try again.

                    </span>

                </td>

            </tr>

        `;


        /* =================================================
           HIDE INITIAL LOADING EVEN IF FIREBASE FAILS
           ================================================= */

        if(loadingOverlay){

            loadingOverlay.style.display = "none";

        }

    }

}
async function solveReport(docId){

    showAlert(

        "The report is being marked as solved.\n\nPlease wait...",

        null,

        true,

        "✔ Solving Report",

        true

    );


    try{

        await updateDoc(

            doc(db,"reports",docId),

            {
                status:"Solved"
            }

        );


        await loadReports();


        showAlert(

            "The report has been successfully marked as solved.",

            null,

            true,

            "✅ Report Solved"

        );

    }

    catch(error){

        console.error(
            "Report solving error:",
            error
        );


        showAlert(

            "The report could not be marked as solved.\n\nPlease check your internet connection and try again.",

            null,

            true,

            "❌ Update Failed"

        );

    }

}

async function deleteReport(docId){

    showAlert(

        "🗑 Delete this report permanently?",

        async function(){

            /* =================================================
               SHOW DELETING LOADING
               ================================================= */

            showAlert(

                "The report is being permanently deleted.\n\nPlease wait...",

                null,

                true,

                "🗑 Deleting Report...",

                true

            );


            try{

                await deleteDoc(
                    doc(db,"reports",docId)
                );


                await loadReports();


                showAlert(

                    "The report has been permanently deleted.",

                    null,

                    true,

                    "🗑 Report Deleted"

                );

            }

            catch(error){

                console.error(
                    "Report deletion error:",
                    error
                );


                showAlert(

                    "The report could not be deleted.\n\nPlease check your internet connection and try again.",

                    null,

                    true,

                    "❌ Deletion Failed"

                );

            }

        },

        false,

        "Delete Report"

    );

}
async function findProperty(name){

const snapshot =
await getDocs(collection(db,"properties"));

let found=false;

snapshot.forEach(d=>{

const p=d.data();

if(
(p.name || "").trim().toLowerCase() ===
(name || "").trim().toLowerCase()
){

found=true;

window.location.href=
"property.html?id="+d.id;

}

});

if(!found){

showAlert(
"🏠 Property not found.",
null,
true
);

}

}

function openImage(src){

document.getElementById(
"popupImage"
).src = src;

document.getElementById(
"imagePopup"
).style.display="flex";

}

function closeImage(){

document.getElementById("imagePopup").style.display="none";

const image =
document.getElementById("popupImage");

image.style.transform="scale(1)";

image.style.cursor="zoom-in";

zoomed=false;

}
let zoomed = false;

function zoomImage(){

let image =
document.getElementById("popupImage");

if(!zoomed){

image.style.transform = "scale(2)";
image.style.cursor = "zoom-out";

zoomed = true;

}
else{

image.style.transform = "scale(1)";
image.style.cursor = "zoom-in";

zoomed = false;

}

}

 window.showAlert = function(
    message,
    okAction,
    hideLater = false,
    title = "Gedarak.lk",
    hideButtons = false
){

    const modal =
        document.getElementById("gedarakModal");


    /* =====================================================
       BUTTONS
       ===================================================== */

    const buttons =
        document.querySelector(".modal-buttons");


    buttons.style.display =
        hideButtons
        ? "none"
        : "flex";


    /* =====================================================
       SPINNER
       ===================================================== */

    let spinner =
        document.getElementById("reportActionSpinner");


    if(!spinner){

        spinner =
            document.createElement("div");

        spinner.id =
            "reportActionSpinner";

        spinner.innerHTML =
            "⏳";

        spinner.style.cssText = `
            display:none;
            font-size:50px;
            margin-bottom:15px;
            animation:reportsSpin .8s linear infinite;
        `;

        document
            .querySelector(".modal-box")
            .insertBefore(
                spinner,
                document.getElementById("modalTitle")
            );

    }


    spinner.style.display =
        hideButtons
        ? "block"
        : "none";


    /* =====================================================
       TITLE
       ===================================================== */

    document.getElementById(
        "modalTitle"
    ).textContent =
        title;


    /* =====================================================
       MESSAGE
       ===================================================== */

    document.getElementById(
        "modalMessage"
    ).textContent =
        message;


    /* =====================================================
       CANCEL BUTTON
       ===================================================== */

    const laterBtn =
        document.getElementById("modalLater");


    laterBtn.style.display =
        hideLater
        ? "none"
        : "inline-block";


    /* =====================================================
       SHOW MODAL
       ===================================================== */

    modal.style.display =
        "flex";


    /* =====================================================
       OK BUTTON
       ===================================================== */

    document.getElementById(
        "modalOk"
    ).onclick = function(){

        modal.style.display =
            "none";


        if(okAction){

            okAction();

        }

    };


    /* =====================================================
       CANCEL BUTTON
       ===================================================== */

    laterBtn.onclick = function(){

        modal.style.display =
            "none";

    };

};


window.solveReport = solveReport;
window.deleteReport = deleteReport;
window.findProperty = findProperty;
window.openImage = openImage;
window.closeImage = closeImage;
window.zoomImage = zoomImage;
window.loadReports = loadReports;

</script>

<div

id="imagePopup"
onclick="closeImage()"
style="
display:none;
position:fixed;
top:0;
left:0;
width:100%;
height:100%;
background:rgba(0,0,0,.88);
justify-content:center;
align-items:center;
z-index:99999;
transition:.25s;
cursor:zoom-in;
">

<img
id="popupImage"

onclick="
event.stopPropagation();
zoomImage();
"

style="
width:auto;
height:auto;

width:95vw;
height:95vh;


object-fit:contain;

border-radius:12px;

box-shadow:0 0 40px rgba(255,255,255,.35);
">

<div

onclick="closeImage()"

style="
position:absolute;
top:25px;
right:35px;
font-size:42px;
color:white;
cursor:pointer;
font-weight:bold;
">

×

</div>

</div>

</body>
