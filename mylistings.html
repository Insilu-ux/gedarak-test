<script type="module">

import { auth, db } from "./firebase-config.js";

import {
    onAuthStateChanged
} from "https://www.gstatic.com/firebasejs/12.16.0/firebase-auth.js";

import {
    collection,
    getDocs,
    query,
    where
} from "https://www.gstatic.com/firebasejs/12.16.0/firebase-firestore.js";

import { deletePropertyCompletely } from "./delete-property.js";


let totalListings = 0;
let totalViews = 0;

const container =
    document.getElementById("myProperties");


onAuthStateChanged(auth, async function(user){

    /*
    ==========================================
    NOT LOGGED IN
    ==========================================
    */

    if(!user){

        document.getElementById("listingCount").innerHTML =
            "0 Active Listings";

        container.innerHTML = `

        <div
        style="
        max-width:700px;
        margin:50px auto;
        padding:35px;
        background:white;
        border-radius:18px;
        box-shadow:0 8px 25px rgba(0,0,0,.12);
        text-align:center;
        ">

        <div
        style="
        font-size:70px;
        margin-bottom:15px;
        ">
        🏡
        </div>

        <h2>
        No Listings Yet
        </h2>

        <p
        style="
        font-size:18px;
        color:#666;
        line-height:1.8;
        ">

        You haven't posted any properties yet.

        Create your first listing and start reaching buyers across Sri Lanka.

        </p>

        <button
        onclick="openPostProperty()"
        style="
        padding:14px 28px;
        font-size:18px;
        margin-top:20px;
        cursor:pointer;
        border:none;
        border-radius:10px;
        ">

        ➕ Post Your First Property

        </button>

        </div>

        `;

        hideMyListingsLoader();

        return;
    }


    /*
    ==========================================
    LOGGED IN
    ==========================================
    */

    try{

        /*
        Reset counters in case the auth listener
        ever runs more than once.
        */

        totalListings = 0;
        totalViews = 0;

        container.innerHTML = "";


        /*
        Get only this user's properties
        */

        const q =
            query(
                collection(db,"properties"),
                where("ownerUid","==",user.uid)
            );


        const snapshot =
            await getDocs(q);


        /*
        Render properties
        */

        snapshot.forEach(function(document){

            const property =
                document.data();

            const key =
                document.id;


            totalListings++;

            totalViews +=
                Number(property.views || 0);


            /*
            Safe image fallback
            */

            const image =
                property.images?.[0] ||
                "favicon.png";


            /*
            Safe created date
            */

            let createdText =
                "Recently";

            if(
                property.createdAt &&
                typeof property.createdAt.toMillis === "function"
            ){

                createdText =
                    timeAgo(
                        property.createdAt.toMillis()
                    );

            }


            container.innerHTML += `

            <div
            style="
            background:white;
            border-radius:18px;
            overflow:hidden;
            box-shadow:0 8px 25px rgba(0,0,0,.12);
            margin:35px auto;
            max-width:700px;
            ">

            <div class="propertyImageWrapper">

            <img
            src="${image}"
            class="propertyImage"
            alt="${property.name || "Property"}">

            <div class="propertyWatermarkText">
            Gedarak.lk
            </div>

            </div>


            <div style="padding:20px;">


            <div
            style="
            display:flex;
            justify-content:space-between;
            align-items:center;
            margin-bottom:10px;
            ">

            ${
                property.boost

                ?

                `
                <span
                style="
                background:#f59e0b;
                color:white;
                padding:6px 14px;
                border-radius:20px;
                font-size:14px;
                font-weight:bold;
                ">
                ⭐ Boosted
                </span>
                `

                :

                `
                <span
                style="
                background:#e5e7eb;
                color:#555;
                padding:6px 14px;
                border-radius:20px;
                font-size:14px;
                ">
                Normal Listing
                </span>
                `
            }


            <span
            style="
            font-size:15px;
            color:#666;
            ">
            👁 ${property.views || 0}
            </span>

            </div>


            <h2
            style="
            font-size:30px;
            font-weight:700;
            margin-bottom:15px;
            ">
            ${property.name || "Unnamed Property"}
            </h2>


            <h2
            style="
            font-size:32px;
            font-weight:bold;
            color:#0f766e;
            margin:0;
            ">

            ${
                property.negotiable
                ?
                "💬 Negotiable"
                :
                "💸 Rs. " +
                Number(property.price || 0).toLocaleString()
            }

            </h2>


            <p>
            🏠 ${property.propertyType || "Property"}
            </p>


            <p>
            📍 ${property.city || ""}, ${property.district || ""}
            </p>


            <p>
            📅 ${createdText}
            </p>


            ${
                property.propertyType === "Land"

                ?

                `
                <p>
                🌳 ${property.perches || 0} Perches
                </p>
                `

                :

                `
                <p>
                🛏 ${property.bedrooms || 0} Beds
                |
                🛁 ${property.bathrooms || 0} Baths
                </p>

                <p>
                📐 ${Number(
                    property.squareFeet || 0
                ).toLocaleString()} Sqft
                |
                🌳 ${property.perches || 0} Perches
                </p>
                `
            }


            <p>

            ${
                property.status == "For Sale"

                ?

                "🟢 For Sale"

                :

                property.status == "For Rent"

                ?

                "🔵 For Rent"

                :

                "🟣 For Sale / Rent"
            }

            </p>


            <div
            style="
            display:grid;
            grid-template-columns:repeat(2,1fr);
            gap:12px;
            margin-top:20px;
            ">


            <button
            style="
            padding:15px 0;
            font-size:17px;
            font-weight:600;
            border:none;
            border-radius:12px;
            cursor:pointer;
            transition:.25s;
            height:52px;
            background:#2563eb;
            color:white;
            "
            onclick="viewProperty('${key}')">

            👁 View

            </button>


            <button
            style="
            padding:15px 0;
            font-size:17px;
            font-weight:600;
            border:none;
            border-radius:12px;
            cursor:pointer;
            transition:.25s;
            height:52px;
            background:#16a34a;
            color:white;
            "
            onclick="editProperty('${key}')">

            ✏ Edit

            </button>


            <button
            style="
            padding:15px 0;
            font-size:17px;
            font-weight:600;
            border:none;
            border-radius:12px;
            cursor:pointer;
            transition:.25s;
            height:52px;
            background:#dc2626;
            color:white;
            "
            onclick="deleteProperty('${key}')">

            🗑 Delete

            </button>


            </div>

            </div>

            </div>

            `;

        });


        /*
        ==========================================
        NO LISTINGS
        ==========================================
        */

        if(totalListings === 0){

            container.innerHTML = `

            <div
            style="
            max-width:700px;
            margin:50px auto;
            padding:35px;
            background:white;
            border-radius:18px;
            box-shadow:0 8px 25px rgba(0,0,0,.12);
            text-align:center;
            ">

            <div
            style="
            font-size:70px;
            margin-bottom:15px;
            ">
            🏡
            </div>

            <h2>
            No Listings Yet
            </h2>

            <p
            style="
            font-size:18px;
            color:#666;
            line-height:1.8;
            ">

            You haven't posted any properties yet.

            Create your first listing and start reaching buyers across Sri Lanka.

            </p>

            <button
            onclick="openPostProperty()"
            style="
            padding:14px 28px;
            font-size:18px;
            margin-top:20px;
            cursor:pointer;
            border:none;
            border-radius:10px;
            ">

            ➕ Post Your First Property

            </button>

            </div>

            `;

        }


        /*
        ==========================================
        LISTING COUNT
        ==========================================
        */

        document.getElementById("listingCount").innerHTML =

            totalListings +

            (
                totalListings == 1
                ?
                " Active Listing"
                :
                " Active Listings"
            );


    }


    /*
    ==========================================
    FIRESTORE / NETWORK ERROR
    ==========================================
    */

    catch(error){

        console.error(
            "Error loading listings:",
            error
        );


        container.innerHTML = `

        <div
        style="
        max-width:700px;
        margin:50px auto;
        padding:35px;
        background:white;
        border-radius:18px;
        box-shadow:0 8px 25px rgba(0,0,0,.12);
        text-align:center;
        ">

        <div
        style="
        font-size:70px;
        margin-bottom:15px;
        ">
        ⚠️
        </div>


        <h2>
        Unable to Load Listings
        </h2>


        <p
        style="
        font-size:18px;
        color:#666;
        line-height:1.8;
        ">

        We couldn't load your listings right now.

        Please check your internet connection and try again.

        </p>


        <button
        onclick="location.reload()"
        style="
        padding:14px 28px;
        font-size:18px;
        margin-top:20px;
        cursor:pointer;
        border:none;
        border-radius:10px;
        background:#8b008b;
        color:white;
        font-weight:600;
        ">

        🔄 Try Again

        </button>

        </div>

        `;

    }


    /*
    ==========================================
    ALWAYS HIDE LOADING POPUP
    ==========================================
    */

    finally{

        hideMyListingsLoader();

    }

});



/*
==========================================
DELETE PROPERTY
==========================================
*/

window.deleteProperty = function(key){

    showAlert(
        "Delete this property permanently?",

        async function(){

            try{

                await deletePropertyCompletely(key);

                showAlert(
                    "Property deleted successfully.",

                    function(){

                        location.reload();

                    },

                    true

                );

            }

            catch(error){

                console.error(
                    "Error deleting property:",
                    error
                );

                showAlert(
                    "Unable to delete this property right now. Please try again.",
                    null,
                    true,
                    "⚠️ Error"
                );

            }

        },

        false,

        "⚠️ Warning"
    );

};



/*
==========================================
EDIT PROPERTY
==========================================
*/

window.editProperty = function(id){

    sessionStorage.setItem(
        "editPropertyId",
        id
    );

    window.location.href =
        "editproperty.html";

};



/*
==========================================
VIEW PROPERTY
==========================================
*/

window.viewProperty = function(id){

    window.location.href =
        `property.html?id=${id}`;

};



/*
==========================================
CUSTOM ALERT
==========================================
*/

window.showAlert = function(
    message,
    okAction,
    hideLater = false,
    title = "Gedarak.lk"
){

    const modal =
        document.getElementById("gedarakModal");


    document.getElementById("modalTitle").textContent =
        title;


    document.getElementById("modalMessage").textContent =
        message;


    const laterBtn =
        document.getElementById("modalLater");


    laterBtn.style.display =
        hideLater
        ?
        "none"
        :
        "inline-block";


    modal.style.display =
        "flex";


    document.getElementById("modalOk").onclick =
        function(){

            modal.style.display =
                "none";


            if(okAction){

                okAction();

            }

        };


    laterBtn.onclick =
        function(){

            modal.style.display =
                "none";

        };

};



/*
==========================================
POST PROPERTY
==========================================
*/

window.openPostProperty = function(){

    if(!auth.currentUser){

        showAlert(

            "Please login first",

            function(){

                window.location.href =
                    "login.html";

            }

        );

        return;

    }


    window.location.href =
        "postproperty.html";

};



/*
==========================================
BOOST PROPERTY
==========================================
*/

window.openBoost = function(id){

    sessionStorage.setItem(
        "selectedBoostProperty",
        id
    );

    window.location.href =
        "boost.html";

};



/*
==========================================
TIME AGO
==========================================
*/

function timeAgo(date){

    let diff =
        Date.now() - date;


    let days =
        Math.floor(
            diff / 86400000
        );


    if(days <= 0){

        return "Today";

    }


    if(days == 1){

        return "Yesterday";

    }


    if(days < 30){

        return (
            days +
            " days ago"
        );

    }


    let months =
        Math.floor(
            days / 30
        );


    if(months < 12){

        return (

            months +

            " month" +

            (
                months > 1
                ?
                "s"
                :
                ""
            ) +

            " ago"

        );

    }


    let years =
        Math.floor(
            months / 12
        );


    return (

        years +

        " year" +

        (
            years > 1
            ?
            "s"
            :
            ""
        ) +

        " ago"

    );

}



/*
==========================================
HIDE LOADING POPUP
==========================================
*/

function hideMyListingsLoader(){

    const loader =
        document.getElementById(
            "myListingsLoadingOverlay"
        );


    if(loader){

        loader.style.display =
            "none";

    }

}

</script>
