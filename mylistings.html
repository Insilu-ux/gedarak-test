<!DOCTYPE html>
<html>
    <head>
        <meta charset="UTF-8">

<meta name="viewport" content="width=device-width, initial-scale=1.0">
        <style>
                    .pageHeader{

display:flex;

justify-content:center;

align-items:center;

margin-bottom:30px;

padding-bottom:15px;

border-bottom:1px solid #ddd;

}

.logoLink{

display:flex;

align-items:center;

gap:12px;

text-decoration:none;

color:black;

}

.pageLogo{

width:55px;

height:55px;

object-fit:contain;

}

.logoLink h2{

margin:0;

font-size:32px;

font-weight:bold;

color:#8b008b;

}

@media(max-width:600px){

.pageLogo{

width:42px;

height:42px;

}

.logoLink h2{

font-size:24px;

}

}
.tagline{

margin:0;

font-size:14px;

color:#666;

}
   
@media(max-width:700px){

#myProperties{

padding:10px;

}

#myProperties button{

width:auto;

padding:12px 22px;

font-size:16px;

font-weight:600;

border-radius:10px;

}
}
footer{

margin-top:70px;

padding:40px 20px;

background:#f8f8f8;

border-top:1px solid #ddd;

text-align:center;

}
#gedarakModal{

position:fixed;

top:0;
left:0;

width:100%;
height:100%;

background:rgba(0,0,0,.45);

display:none;

align-items:center;
justify-content:center;

z-index:999999;

}


.modal-box{

background:white;

width:90%;
max-width:420px;

padding:35px;

border-radius:20px;

text-align:center;

box-shadow:0 15px 40px rgba(0,0,0,.3);

animation:popup .25s ease;

}


.modal-box h2{

margin:0 0 15px;

font-size:26px;

}


.modal-box p{

font-size:22px;

font-weight:600;

color:#333;

line-height:1.5;

}


.modal-buttons{

display:flex;

gap:12px;

justify-content:center;

margin-top:25px;

}


.modal-buttons button{

padding:12px 25px;

border:none;

border-radius:12px;

font-size:16px;

font-weight:bold;

cursor:pointer;

}


.modal-ok{

background:#16a34a;

color:white;

}


.modal-later{

background:#e5e7eb;

color:#333;

}


@keyframes popup{

from{

transform:scale(.8);

opacity:0;

}

to{

transform:scale(1);

opacity:1;

}

}
</style>
    </head>
    <body>
        <a href="index.html">
        <button class="home-btn">
        💒 Home
        </button>
    </a>
       <header class="pageHeader">

<a href="index.html" class="logoLink">

<img
src="Frame 1.png"
class="pageLogo">

<div>

<h2>

Gedarak.lk

</h2>

<p class="tagline">

Sri Lanka's Property Marketplace

</p>

</div>

</a>

</header>
       <h1
style="
font-size:38px;
font-weight:700;
margin-top:30px;
margin-bottom:8px;
text-align:center;
">
My Listings
</h1>
        <h3
id="listingCount"
style="
text-align:center;
color:#666;
font-size:18px;
margin-bottom:35px;
font-weight:500;
">
</h3>
        <div id="myProperties"></div>
        <div id="gedarakModal">

<div class="modal-box">

<h2 id="modalTitle">
Gedarak.lk
</h2>

<p id="modalMessage"></p>

<div class="modal-buttons">

<button
id="modalOk"
class="modal-ok">
OK
</button>

<button
id="modalLater"
class="modal-later">
Later
</button>

</div>

</div>

</div>
          <footer>
        <h3>Gedarak.lk</h3>
        <p>Find your dream property</p>
         <p>Email: <a href="mailto:gedarak.lk@gmail.com">
gedarak.lk@gmail.com
</a></p>
        <p>Phone: +94 771 234 567</p>
        <p>&copy; 2026 Gedarak.lk</p>
      </footer>
        <script type="module">
            import { auth, db } from "./firebase-config.js";

import {
    onAuthStateChanged
} from "https://www.gstatic.com/firebasejs/12.16.0/firebase-auth.js";

import {
    collection,
    getDocs,
    query,
    where,
    deleteDoc,
    doc,
    getDoc
} from "https://www.gstatic.com/firebasejs/12.16.0/firebase-firestore.js";

            let totalListings = 0;
            let totalViews = 0;
            let container= 
             document.getElementById(
                "myProperties"
            );
            onAuthStateChanged(auth, async function(user){

  if(!user){

        document.getElementById("listingCount").innerHTML =
        "0 Active Listings";

        container.innerHTML = `
      <div
style="
max-width:700px;
margin:50px auto;
padding:35px;
background:white;
border-radius:18px;
box-shadow:0 8px 25px rgba(0,0,0,.12);
text-align:center;
">

<div
style="
font-size:70px;
margin-bottom:15px;
">
🏡
</div>

<h2>
No Listings Yet
</h2>

<p
style="
font-size:18px;
color:#666;
line-height:1.8;
">

You haven't posted any properties yet.

Create your first listing and start reaching buyers across Sri Lanka.

</p>

<button
onclick="openPostProperty()"
style="
padding:14px 28px;
font-size:18px;
margin-top:20px;
cursor:pointer;
border:none;
border-radius:10px;
">

➕ Post Your First Property

</button>

</div> `;

        return;
    }


    const q =
query(
    collection(db,"properties"),
    where("ownerUid","==",user.uid)
);

    const snapshot =
    await getDocs(q);

    snapshot.forEach(function(document){

        const property =
        document.data();

        const key =
        document.id;

        totalListings++;

        totalViews += property.views || 0;

         container.innerHTML += `

<div
style="
background:white;
border-radius:18px;
overflow:hidden;
box-shadow:0 8px 25px rgba(0,0,0,.12);
margin:35px auto;
max-width:700px;
">

<img
src="${property.images[0]}"
style="
width:100%;
height:320px;
display:block;
object-fit:cover;
">

<div style="padding:20px;">

<div
style="
display:flex;
justify-content:space-between;
align-items:center;
margin-bottom:10px;
">

${property.boost ?

`
<span
style="
background:#f59e0b;
color:white;
padding:6px 14px;
border-radius:20px;
font-size:14px;
font-weight:bold;
">
⭐ Boosted
</span>
`

:

`
<span
style="
background:#e5e7eb;
color:#555;
padding:6px 14px;
border-radius:20px;
font-size:14px;
">
Normal Listing
</span>
`
}

<span
style="
font-size:15px;
color:#666;
">
👁 ${property.views || 0}
</span>

</div>

<h2
style="
font-size:30px;
font-weight:700;
margin-bottom:15px;
">
${property.name}
</h2>

<h2
style="
font-size:32px;
font-weight:bold;
color:#0f766e;
margin:0;
">
${
property.negotiable
?
"💬 Negotiable"
:
"💸 Rs. "+Number(property.price).toLocaleString()
}
</h2>

<p>
🏠 ${property.propertyType}
</p>

<p>
📍 ${property.city}, ${property.district}
</p>

<p>
📅 ${timeAgo(
property.createdAt.toMillis()
)}
</p>

${
property.propertyType === "Land"

?

`
<p>
🌳 ${property.perches || 0} Perches
</p>
`

:

`
<p>
🛏 ${property.bedrooms || 0} Beds
|
🛁 ${property.bathrooms || 0} Baths
</p>

<p>
📐 ${Number(property.squareFeet || 0).toLocaleString()} Sqft
|
🌳 ${property.perches || 0} Perches
</p>
`
                    }
<p>

${property.status=="For Sale"

?

"🟢 For Sale"

:

property.status=="For Rent"

?

"🔵 For Rent"

:

"🟣 For Sale / Rent"

}

</p>

<div
style="
display:grid;

grid-template-columns:repeat(2,1fr);

gap:14px;

margin-top:28px;
gap:12px;
margin-top:20px;
">

<button
style="
padding:15px 0;

font-size:17px;

font-weight:600;

border:none;

border-radius:12px;

cursor:pointer;

transition:.25s;

height:52px;
background:#2563eb;

color:white;"
onclick="viewProperty('${key}')">
👁 View
</button>

<button
style="
padding:15px 0;

font-size:17px;

font-weight:600;

border:none;

border-radius:12px;

cursor:pointer;

transition:.25s;

height:52px;
background:#16a34a;

color:white;"
onclick="editProperty('${key}')">
✏ Edit
</button>

<button
style="
padding:15px 0;

font-size:17px;

font-weight:600;

border:none;

border-radius:12px;

cursor:pointer;

transition:.25s;

height:52px;
background:#f59e0b;

color:white;"
onclick="openBoost('${key}')">
🚀 ${property.boost ? "Boost Again" : "Boost"}
</button>

<button
style="
padding:15px 0;

font-size:17px;

font-weight:600;

border:none;

border-radius:12px;

cursor:pointer;

transition:.25s;

height:52px;
background:#dc2626;

color:white;
"
onclick="deleteProperty('${key}')">
🗑 Delete
</button>

</div>

</div>

</div>

`;

    })
    if(totalListings===0){

container.innerHTML = `

<div
style="
max-width:700px;
margin:50px auto;
padding:35px;
background:white;
border-radius:18px;
box-shadow:0 8px 25px rgba(0,0,0,.12);
text-align:center;
">

<div
style="
font-size:70px;
margin-bottom:15px;
">
🏡
</div>

<h2>
No Listings Yet
</h2>

<p
style="
font-size:18px;
color:#666;
line-height:1.8;
">

You haven't posted any properties yet.

Create your first listing and start reaching buyers across Sri Lanka.

</p>

<button
onclick="openPostProperty()"
style="
padding:14px 28px;
font-size:18px;
margin-top:20px;
cursor:pointer;
border:none;
border-radius:10px;
">

➕ Post Your First Property

</button>

</div>

`;

};

    document.getElementById("listingCount").innerHTML =
    totalListings +
    (totalListings==1 ?
    " Active Listing" :
    " Active Listings");

});
            
    window.deleteProperty = function(key){

    showAlert(
    "Delete this property permanently?",
    async function(){

        await deleteDoc(
            doc(db,"properties",key)
        );

        showAlert(
            "Property deleted successfully.",
            function(){

                location.reload();

            },
            true
        );

    },
    false,
    "⚠️ Warning"
);

}
                         window.editProperty = function(id){
                            sessionStorage.setItem(
"editPropertyId",
id
);
                            window.location.href = 
                            "editproperty.html";
                        }
                        window.viewProperty = function(id){

window.location.href =
`property.html?id=${id}`;

}
                        
                    window.showAlert = function(
    message,
    okAction,
    hideLater = false,
    title = "Gedarak.lk"
){

    const modal =
    document.getElementById("gedarakModal");

    document.getElementById("modalTitle").textContent =
    title;

    document.getElementById("modalMessage").textContent =
    message;

    const laterBtn =
    document.getElementById("modalLater");

    laterBtn.style.display =
    hideLater ? "none" : "inline-block";

    modal.style.display = "flex";

    document.getElementById("modalOk").onclick = function(){

        modal.style.display = "none";

        if(okAction){

            okAction();

        }

    };

    laterBtn.onclick = function(){

        modal.style.display = "none";

    };

}


window.openPostProperty = function(){

    if(!auth.currentUser){

        showAlert(
            "Please login first",
            function(){

                window.location.href="login.html";

            }
        );

        return;

    }

    window.location.href="postproperty.html";

}
                    window.openBoost = function(id){

sessionStorage.setItem(
"selectedBoostProperty",
id
);

window.location.href="boost.html";

}
function timeAgo(date){

let diff =
Date.now()-date;

let days =
Math.floor(diff/86400000);

if(days==0){

return "Today";

}

if(days==1){

return "Yesterday";

}

if(days<30){

return days+" days ago";

}

let months=
Math.floor(days/30);

if(months<12){

return months+" month"+

(months>1?"s":"")+

" ago";

}

let years=
Math.floor(months/12);

return years+

" year"+

(years>1?"s":"")+

" ago";

}

        </script>
    </body>
</html>
