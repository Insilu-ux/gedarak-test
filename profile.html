            <script type="module">
                import { auth, db } from "./firebase-config.js";

import {
onAuthStateChanged,
signOut
}
from "https://www.gstatic.com/firebasejs/12.16.0/firebase-auth.js";

import {
    doc,
    getDoc,
    collection,
    getDocs,
    query,
    where
} from "https://www.gstatic.com/firebasejs/12.16.0/firebase-firestore.js";

 let listings=0;
let totalViews=0;
let totalSaves=0;
            let currentUser = null;
            let username = "";

onAuthStateChanged(auth, async function(user){


    currentUser = user;

    const userDoc =
    await getDoc(doc(db,"users",user.uid));

    if(userDoc.exists()){

        const data = userDoc.data();

       username = data.username;

        document.getElementById("userName").innerHTML =
        "Welcome back,<br>" + data.username;

        let joined = "";

        if(data.createdAt){

            joined =
            data.createdAt.toDate().toLocaleDateString();

        }else{

            joined = "Recently";

        }

        document.getElementById("joinedDate").innerHTML =
        "📅 Member since " + joined;

        document.getElementById("userEmail").innerHTML =
        "📧 " + data.email;

    }
await loadUserStats();

});
           async function loadUserStats(){

    listings = 0;
    totalViews = 0;
    totalSaves = 0;


    // GET ALL PROPERTIES POSTED BY THIS USER

    const propertySnapshot =
    await getDocs(collection(db,"properties"));


    propertySnapshot.forEach(function(propertyDoc){

        let property =
        propertyDoc.data();


        if(
            String(property.ownerUid) === 
            String(currentUser.uid)
        ){

            listings++;

            totalViews += 
            property.views || 0;

        }


    });



// GET USER SAVES

const userSnapshot =
await getDoc(
    doc(db,"users",currentUser.uid)
);

if(userSnapshot.exists()){

    const existingProperties = new Set();

    propertySnapshot.forEach(function(propertyDoc){

        existingProperties.add(propertyDoc.id);

    });

    const data = userSnapshot.data();

    const favouriteIds = data.favourites || [];

    totalSaves = favouriteIds.filter(id =>
        existingProperties.has(id)
    ).length;

}
    document.getElementById("listingCount").innerText =
    listings;


    document.getElementById("totalViews").innerText =
    totalViews.toLocaleString();


    document.getElementById("totalSaves").innerText =
    totalSaves.toLocaleString();


}


            window.logout = function(){

    showAlert(
        "Are you sure you want to log out?",
        async function(){

            await signOut(auth);

            window.location.href="login.html";

        }
    );

}
            window.showAlert = function(message, okAction){

let modal =
document.getElementById("gedarakModal");

let msg =
document.getElementById("modalMessage");

msg.textContent = message;

modal.style.display="flex";


document.getElementById("modalOk").onclick=function(){

modal.style.display="none";

if(okAction){
    okAction();
}

};


document.getElementById("modalLater").onclick=function(){

modal.style.display="none";

};

}
window.openPostProperty = function(){

    if(!auth.currentUser){

        showAlert("Please login first",function(){

            window.location.href="login.html";

        });

        return;

    }

    window.location.href="postproperty.html";

}
window.startVerification = function () {

    if (!auth.currentUser) {

        showAlert("Please login first.", function () {
            window.location.href = "login.html";
        });

        return;
    }

    window.location.href = "vertification.html";

};
