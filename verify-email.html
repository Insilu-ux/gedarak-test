<title>Email Verification</title>
</head>

<body>

<h1 style="text-align:center;">
📧 Verifying Email...
</h1>


<p 
id="status"
style="
text-align:center;
font-size:20px;
">
Please wait...
</p>


<script>

const params =
new URLSearchParams(window.location.search);


const token =
params.get("token");



async function verifyEmail(){


if(!token){

document.getElementById("status").innerHTML =
"❌ Invalid verification link.";

return;

}



try{


const response = await fetch(

"https://us-central1-gedarak-26ca6.cloudfunctions.net/confirmEmailVerification",

{

method:"POST",

headers:{

"Content-Type":"application/json"

},

body:JSON.stringify({

token:token

})

}

);



const result =
await response.json();



if(result.success){


document.getElementById("status").innerHTML =

"✔ Email verified successfully!<br><br>You can return to Gedarak.lk.";


}

else{


document.getElementById("status").innerHTML =

"❌ " + result.message;


}



}

catch(error){

console.log(error);


document.getElementById("status").innerHTML =

"❌ Verification failed.";

}


}



verifyEmail();


</script>


</body>
